# Punar EFI System Partition. The UUID is a release ABI: installers, update
# payloads, recovery media and fleet diagnostics all compare this literal.
[Partition]
Type=esp
UUID=8bb56554-b5f1-4058-90ac-8dc91a8e2bd4
Label=PUNAR-ESP
Format=vfat
SizeMinBytes=1G
SizeMaxBytes=1G
MountPoint=/efi:"umask=0077,noexec,nosuid,nodev"
