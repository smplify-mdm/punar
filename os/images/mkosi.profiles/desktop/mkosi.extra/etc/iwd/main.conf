# Punar Wi-Fi daemon configuration.
#
# iwd handles ASSOCIATION (scanning, auth, roaming); systemd-networkd handles
# ADDRESSING. That split is deliberate and is why EnableNetworkConfiguration is
# left at its default of false: one DHCP client on this machine, the same one
# that serves ethernet, configured once in 50-punar-dhcp.network and
# 60-punar-wifi.network beside it.

[General]
# A PERMANENT MAC ADDRESS IS A CROSS-NETWORK TRACKING IDENTIFIER, and iwd's own
# manual says so: "it is possible for networks to track the user by the mac
# address which is permanent." A laptop is carried between cafés, offices and
# airports, announcing the same hardware identity to each — which is precisely
# the correlation a privacy-first OS exists to break.
#
# `network` rather than `once`: the address is derived from the SSID and the
# adapter's permanent address, so it is STABLE for a given network — captive
# portals, MAC allowlists and DHCP reservations keep working — while being
# different for every other network, so no two networks can be joined up.
# `once` would randomize per boot, which breaks those things without buying
# any additional privacy between networks.
#
# Same posture as SendHostname=no in 50-punar-dhcp.network: the machine
# declines to hand out durable identifiers it was never asked for.
AddressRandomization=network

[Scan]
# Do not broadcast the names of networks previously joined. A directed probe
# request advertises "this device knows SSID X", which leaks a location history
# to anyone listening. The cost is that hidden networks need an explicit
# connect, which is the correct trade for a device that travels.
DisablePeriodicScan=false
