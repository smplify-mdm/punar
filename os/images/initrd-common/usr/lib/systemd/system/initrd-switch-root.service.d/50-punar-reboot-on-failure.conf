# A failed switch-root reboots, so boot counting can fall back to the other
# slot with no one at the machine. Upstream only starts emergency.target,
# which on a release image is a locked-root console, and after
# punar-release-initramfs.service has run it has no shell to start at all.
# reboot-force needs no unit file, only systemd-shutdown, which the release
# keeps. This drop-in exists only in the initrd.
[Unit]
FailureAction=reboot-force
