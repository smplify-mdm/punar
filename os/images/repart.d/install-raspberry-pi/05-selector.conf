# Raspberry Pi firmware always reads this small FAT partition first. It owns
# only autoboot.txt, so writing either inactive boot slot can never overwrite
# the last-known-good selector.
[Partition]
Type=esp
UUID=6ab88335-d069-4898-b639-734f3f2b971a
Label=PUNAR-SELECT
Format=vfat
SizeMinBytes=32M
SizeMaxBytes=32M
