# Punar idle policy.
#
# WHY THIS EXISTS: the lock surface (shell/punar-shell/Lock/) and its PAM stack
# (/etc/pam.d/punar-lock) were built, but nothing ever invoked them on its own.
# A Punar desktop left unattended stayed unlocked indefinitely; locking was a
# deliberate act every time, via PUNAR + Escape. A lock screen that only a
# present user can reach protects nothing while they are away from the machine.
#
# WHY A SYSTEM PATH: hypridle's default config is
# ${XDG_CONFIG_HOME}/hypr/hypridle.conf. Auto-lock is a security control, so it
# is root-owned here rather than seeded into a writable user directory where it
# could be edited away by anything running as the user. Hyprland passes this
# path explicitly with -c; the packaged hypridle.service is disabled in
# 00-punar-lean.preset because its ExecStart has no -c.
#
# WHY NOT hyprlock: the package ships one, and Punar does not use it. The lock
# surface is Punar's own Quickshell window driving ext-session-lock-v1 against
# /etc/pam.d/punar-lock. Two lock screens on one session is a way to be locked
# out by a race, not defence in depth.
#
# COST: hypridle implements ext-idle-notify-v1, so it waits on a Wayland event
# rather than polling. It contributes no timer wakeups at idle, which is what
# lets it sit inside the stabilized-idle CPU budget (PERFORMANCE_BUDGETS.md
# section 2.4).

general {
    # loginctl lock-session routes here, so every path to a locked session —
    # the idle timeout below, systemd before-sleep, and a deliberate
    # `loginctl lock-session` — ends at exactly one implementation.
    lock_cmd = qs -p /usr/share/punar/shell ipc call lock lock
    before_sleep_cmd = loginctl lock-session
}

listener {
    # Ten minutes. Long enough not to interrupt reading, short enough that a
    # walked-away laptop is not left open. The screen is not blanked first:
    # this image runs on virtio-vga in VMs where DPMS is not meaningful, and a
    # separate blank step would only add a second thing to get wrong.
    timeout = 600
    on-timeout = loginctl lock-session
}
