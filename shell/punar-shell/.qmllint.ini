; qmllint settings for punar-shell (picked up automatically for files in
; this directory tree; verified with qmllint 6.11.2 from the pinned
; 2026/08/20 snapshot).
;
; ONE targeted downgrade, nothing blanket:
;
;   UncreatableType=disable
;     Quickshell registers its window types with isCreatable: false in its
;     own qmltypes (see Quickshell/_Window/quickshell-window.qmltypes:
;     PanelWindowInterface, exports Quickshell._Window/PanelWindow,
;     "isCreatable: false") because instances are constructed at runtime
;     through Quickshell's window-proxy machinery, not by the QML engine
;     directly. Every `PanelWindow {}` in a Quickshell shell therefore
;     trips [uncreatable-type] even though it is the documented, correct
;     usage. Inherently unresolvable on our side; disabled per-category.
;
; Every other category stays at its qmllint default. If a new warning
; appears, fix the code — do not widen this file.

[Warnings]
UncreatableType=disable
