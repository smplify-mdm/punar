# Production overlay for 50-data.conf. This complete definition intentionally
# shadows the plaintext base only after tools/render-repart-definitions.sh has
# rendered explicit later-directory-wins semantics into /run.
[Partition]
Type=linux-generic
UUID=21d4af4f-a19c-4c6a-b4e8-dd50e9f7ecb9
Label=PUNAR-DATA
Format=btrfs
Encrypt=key-file
MakeDirectories=/@var /@home /@var-tmp
Subvolumes=/@var /@home /@var-tmp
SizeMinBytes=16G
Weight=1000
MountPoint=/var:"subvol=@var,compress=zstd:1,noatime"
MountPoint=/home:"subvol=@home,compress=zstd:1,noatime"
MountPoint=/var/tmp:"subvol=@var-tmp,compress=zstd:1,noatime,nosuid,nodev"
