# Punar graphical greeter compositor.
#
# This is a deliberately smaller Hyprland session than the desktop. It owns
# no app launcher, portal, notification service, polkit agent, terminal server
# or background daemon: one Quickshell process draws first run / login and is
# destroyed before the user's compositor starts. Disabling compositor motion
# here keeps the software-rendered VM path immediate; the card's single state
# receipt still follows the QML reduced-motion contract.

monitor = , preferred, auto, 1

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland

exec-once = qs -p /usr/share/punar/shell/Greeter

input {
    kb_layout = us
    follow_mouse = 0
}

cursor {
    no_hardware_cursors = 2
    inactive_timeout = 8
    hide_on_key_press = true
}

animations {
    enabled = false
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

misc {
    focus_on_activate = true
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_watchdog_warning = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}
