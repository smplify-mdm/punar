# Debian/amd64 package adapter for the shared Punar desktop product tree.
# This starts with the package-equivalent generic-UEFI surface already proven
# on Debian/ARM64. The product build composes the separate hardware-x86
# firmware/microcode profile; physical peripheral qualification remains a
# separate gate before this candidate can replace Arch.

# qml6-module-qtquick-effects is listed below because LockSurface.qml imports
# QtQuick.Effects for the frosted wallpaper. Arch folds that module into
# qt6-declarative, so the Arch lane never had to name it; Debian ships every QML
# module as its own package, and an unnamed import there does not degrade to a
# missing effect — the whole shell fails to load and every surface assertion
# reports "no running instances".
#
# NOTE FOR ANYONE EDITING THE LIST BELOW: no comment may appear inside
# `Packages=`. The substrate contract test collects that block with awk and
# stops at the first line that is not an indented non-comment entry, so an
# inline comment silently truncates the list and hides every package under it.

[Content]
Packages=hyprland
         xdg-desktop-portal-hyprland
         xdg-desktop-portal-gtk
         xdg-desktop-portal
         quickshell
         libqt6svg6
         qt6-wayland
         qml6-module-qt-labs-folderlistmodel
         qml6-module-qtquick-effects
         greetd
         foot
         chromium
         chromium-sandbox
         ca-certificates
         git
         neovim
         geany
         thunar
         thunar-archive-plugin
         tumbler
