[Unit]
Requires=punar-identity-materialize.service
# The socket, not the service: systemd holds the listening socket and starts a
# transaction process per connection, so there is no long-running unit for the
# greeter to wait on. Ordering after it guarantees the greeter never renders a
# "Forgot your password?" affordance before the door behind it exists.
Wants=punar-onboardd.socket
After=punar-identity-materialize.service punar-onboardd.socket
