# Production streaming overlay for 20-root-a.conf. The installer renders this
# fixed definition after the base set so systemd-repart creates slot A without
# trying to materialize an 8 GiB CopyBlocks= source below /run. punard then
# decompresses, hashes, and writes the signed root-slot bytes with its bounded
# buffer before re-opening the partition for physical read-back verification.
[Partition]
Type=root
UUID=1beabfe0-9cb8-4b49-91ef-d372b845e7ea
Label=PUNAR-ROOT-A
SizeMinBytes=8G
SizeMaxBytes=8G
MountPoint=/
