# Punar live-installer boot-artifact profile.
#
# This profile deliberately adds no packages and no root-tree files. The live
# erofs and the slot-A payload must describe the same release tree byte for
# byte (installer I04). Storage and hardware support therefore belong to the
# desktop product profile inherited beside this one.
#
# Pinned mkosi 26's Format=uki embeds the complete OS tree in .initrd, which
# would duplicate the desktop inside the UKI as well as live.erofs. The build
# instead keeps mkosi's hardware-generic default initrd and adds the small
# systemd live-root archive through ARTIFACTDIR/io.mkosi.initrd before ukify
# links the UKI.

[Output]
ImageId=punar-installer-root

[Content]
KernelCommandLine=
KernelCommandLine=console=tty0 rd.systemd.gpt_auto=0 systemd.getty_auto=no punar.live=1
# The ordinary release initrd is hardware-generic. Name the additional modules
# required to find an optical/USB hybrid medium, loop-mount erofs, and place a
# writable overlay over it. Dependencies and firmware are pulled by mkosi.
KernelInitrdModules=default
                       loop
                       overlay
                       erofs
                       isofs
                       sr_mod
                       virtio_blk
                       virtio_pci
                       ahci
                       nvme
