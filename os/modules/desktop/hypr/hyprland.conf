# ────────────────────────────────────────────────────────────────────────────
# PUNAR · HYPRLAND · MILESTONES 1–2
# ────────────────────────────────────────────────────────────────────────────
# System-wide Hyprland configuration for the punar-desktop image.
#
# Install path:   /etc/xdg/hypr/hyprland.conf  (plus the two sourced files
#                 below, same directory). Hyprland 0.56.2 searches
#                 $XDG_CONFIG_HOME/hypr → ~/.config/hypr → $XDG_CONFIG_DIRS →
#                 /etc/xdg/hypr, so the dev user `punar` (no home config)
#                 picks this up automatically; a user config later overrides
#                 it wholesale. session.sh may also pin it explicitly with
#                 `Hyprland --config /etc/xdg/hypr/hyprland.conf`.
#
# Verification (2026-08-24, re-run 2026-08-25 after the M2 grammar): every
# keyword/option/dispatcher below was checked against the v0.56.2 source
# tag (M2 additions: docs/development/milestone-2.md §1), and this file
# (with both sourced files) passes `Hyprland --verify-config` ("config ok")
# on the exact pinned package — hyprland 0.56.2-1 from ALA 2026/08/20 —
# inside the pinned builder base container. A negative control (deliberate
# bad dispatcher) was correctly rejected, so the pass is not vacuous.
# Runtime behavior in the VM stays unverified until the CI run (spec 1.22).
#
# Format note: since 0.55 the hyprlang .conf format is
# "legacy" and Lua is the new default, but 0.56.2 fully supports .conf
# (src/config/legacy/). We ship hyprlang deliberately: it is the decade-
# proven parser, and the Lua surface is one release old. Revisit at the
# next compositor rebase. Keys below that changed since older tutorials:
#   - windowrule uses the 0.56 field grammar (match:… / effect …);
#     `windowrulev2` is a hard config ERROR in 0.56.2.
#   - cursor:no_hardware_cursors is an int (0 off / 1 on / 2 auto).
#   - decoration:shadow:* and decoration:blur:* are nested sections.
#
# Split layout (sourced relative to this file):
#   punar-look.conf   — design language: surfaces, hairlines, motion
#   punar-binds.conf  — the §13.3 keyboard grammar + scratchpad rules
#
# Spec: SPEC_v0.2.md §12 (keyboard-first), §13 (window grammar), §15
# (multi-monitor). Design: docs/design/DESIGN_LANGUAGE.md + punar-tokens.
# Session chain and VM env (AQ_NO_MODIFIERS, LIBGL_ALWAYS_SOFTWARE) live in
# /usr/lib/punar/session.sh (milestone-1.md §4, §6) — not here, because
# aquamarine reads them before this file is parsed.
# ────────────────────────────────────────────────────────────────────────────


# ── VARIABLES ───────────────────────────────────────────────────────────────

$mod = SUPER

# Command center IPC — the punar-shell (Quickshell) contract. ONE variable;
# every consumer binds through it, so the contract changes in exactly one
# place. Contract string is owned by the shell workstream.
$commandCenter = qs -p /usr/share/punar/shell ipc call commandcenter toggle

# Project overview IPC (spec §14.2, milestone-2.md §5) — same contract
# mechanism as $commandCenter: shell IpcHandler target `overview`
# (functions toggle/open/close/state; the bind uses toggle). ONE variable;
# PUNAR+TAB binds through it, the contract changes in exactly one place.
$overview = qs -p /usr/share/punar/shell ipc call overview toggle

# AI panel IPC (spec §25 "PUNAR + A", milestone-7.md §8; Plate D-005) — the
# same contract mechanism again: shell IpcHandler target `aipanel`
# (functions toggle/open/close/state; the bind uses toggle, m7-check probes
# open/state). ONE variable; PUNAR+A binds through it.
$aiPanel = qs -p /usr/share/punar/shell ipc call aipanel toggle

# Session lock IPC (Plate D-002 / D-012 Sect III) — same one-variable
# mechanism. The shell's `lock` target exposes `lock` and `state` and
# deliberately NO `unlock`: an IPC unlock verb would make the session
# socket a complete bypass of the passphrase, and the lock would be
# theatre. So the verb here is `lock`, not `toggle` — there is nothing to
# toggle back. Bound to PUNAR+ESCAPE in punar-binds.conf, which argues the
# chord. The lock itself is ext-session-lock-v1 via Quickshell's
# WlSessionLock, authenticated by a real PAM conversation against the
# `punar-lock` stack (falling back to `login` when /etc/pam.d/punar-lock
# is absent).
$lock = qs -p /usr/share/punar/shell ipc call lock lock

# Layout preset engine (spec §13.5, milestone-2.md §4): one POSIX script,
# one `hyprctl --batch` per invocation. Binds (PUNAR+comma/period) and the
# command center both exec it — neither applies keywords itself. Source of
# truth: os/modules/desktop/hypr/punar-layout.sh, staged by the image
# build to this path.
$layoutScript = /usr/lib/punar/punar-layout.sh

# punar-shell runtime. The shell QML lives OUTSIDE Quickshell's default XDG
# config search (installed to /usr/share/punar/shell, tokens at
# /usr/share/punar/theme/punar-tokens.json — paths baked into Theme.qml), so
# it MUST be launched with -p — and so must every `qs ipc call` client
# (CI run 32822564399: bare `qs ipc` cannot locate the config path and
# fails). A bare `quickshell` would find no config and
# the shell (and the ready-marker chain) would never come up. `qs` and
# `quickshell` are the same package's binaries; the `qs ipc call` client in
# $commandCenter needs no -p while only one instance runs.
$shell = qs -p /usr/share/punar/shell

# Terminal: foot in server mode (started in exec-once below). footclient
# windows share the server's glyph atlas and config — a few MB per extra
# window instead of a full ~25 MB foot process each, which is what the
# PERFORMANCE_BUDGETS idle-RAM ceiling wants. `|| foot` in the bind is the
# fallback if the server is not up (exec goes through /bin/sh -c).
$terminal = footclient
$terminalFallback = foot

# Browser: upstream chromium; the ozone hint makes it pick Wayland when
# WAYLAND_DISPLAY is set instead of falling back to XWayland.
# The browser carries NO launch flags here on purpose. They live in
# /etc/chromium-flags.conf, which the chromium launcher reads on EVERY launch
# path — this bind, the application launcher, xdg-open, a web app. When the
# flag lived on this line it applied to the keybind alone and every other path
# silently got XWayland. One source of truth; surfaces-check.sh asserts that
# the browser reached from here is a native Wayland client.
$browser = chromium

# Scratchpad app-ids (spec §13.6); matched by rules in punar-binds.conf.
# M2 adds assistant and notes scratchpads (milestone-2.md §2) on their own
# special workspaces; their app-ids are the contract for whatever client
# the shell/agent workstream launches there — the rules below park any
# window carrying these ids on the right special workspace as the same
# centered card the terminal uses. Nothing is pre-spawned for them in M2.
$scratchClass = punar-scratch
$assistantClass = punar-assistant
$notesClass = punar-notes
$scratchpadScript = /usr/lib/punar/punar-scratchpad.sh

# Graphical-ready marker script (milestone-1.md §7; image workstream owns it).
$readyScript = /usr/lib/punar/desktop-ready.sh


# ── MONITORS ────────────────────────────────────────────────────────────────

# QEMU virtio-vga exposes its connector as Virtual-1 (milestone-1.md §6).
# The empty-name rule is the catch-all so real hardware and extra virtual
# outputs still light up. scale 1 — no fractional scaling on the dev image.
monitor = Virtual-1, preferred, auto, 1
monitor = , preferred, auto, 1


# ── ENVIRONMENT / PORTALS ───────────────────────────────────────────────────

# XDG identity for portals and app matchers. XDG_SESSION_TYPE is exported by
# session.sh before Hyprland starts.
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# Quickshell is Qt6: force the Wayland QPA. Without it Qt can pick xcb and
# the shell would run as an XWayland client — layer-shell (the bar and the
# command center overlay) only exists on the Wayland side.
env = QT_QPA_PLATFORM,wayland

# ── AUTOSTART ───────────────────────────────────────────────────────────────
# Ordered: D-Bus/systemd env first (portals and socket-activated pipewire
# user services need WAYLAND_DISPLAY), then the shell, then agents, then the
# ready-marker script last — it waits for the shell before signalling
# PUNAR_DESKTOP_OK (milestone-1.md §7).

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

exec-once = $shell

# Re-apply the persisted layout preset (milestone-2.md §4/§6): reads
# layoutPreset from ~/.local/state/punar/workspaces.json, defaults to
# balanced. One-shot process — no daemon, no polling.
exec-once = $layoutScript restore

# Polkit agent for the session (packaged systemd user unit). If the unit is
# missing this fails quietly and only privileged GUI prompts are affected.
exec-once = systemctl --user start hyprpolkitagent.service

# foot server (see $terminal above for the RAM rationale).
exec-once = foot --server

exec-once = $readyScript


# ── INPUT · KEYBOARD-FIRST BEHAVIOR ────────────────────────────────────────
# Spec §12: every first-party flow works without a mouse. Focus is a
# statement the user makes with the keyboard; the pointer never makes it
# for them.

input {
    kb_layout = us

    # 0 = hover never changes focus; clicking still does. Keyboard owns
    # focus (§13.1: "every window should be where the user expects it" —
    # and focused only when they said so).
    follow_mouse = 0
}

binds {
    # PUNAR+H/J/K/L and PUNAR+SHIFT+H/J/K/L spill over monitor edges to the
    # adjacent display — §15 "keyboard movement across displays" for focus
    # and moves; PUNAR+SHIFT+arrows are the explicit cross-monitor grammar.
    window_direction_monitor_fallback = true
}

cursor {
    # VM path (milestone-1.md §6): virtio-vga + llvmpipe — hardware cursor
    # planes are not reliable there. 1 = force software cursors
    # (0.56 int option: 0 off / 1 on / 2 auto).
    no_hardware_cursors = 1

    # Keyboard-first hygiene: the pointer gets out of the way on its own.
    inactive_timeout = 8
    hide_on_key_press = true
}

misc {
    # xdg-activation carries real user intent (e.g. the command center
    # launching an app) — honor it instead of stranding focus.
    focus_on_activate = true

    # greetd execs Hyprland directly (milestone-1.md §4); the start-hyprland
    # watchdog wrapper is not part of the session chain. Suppress its
    # notification so no unexplained chrome lands in the session (or the CI
    # screenshot).
    disable_watchdog_warning = true
}

ecosystem {
    # No unsolicited popups on a system surface (design language: nothing
    # that doesn't explain; also keeps the CI screenshot deterministic).
    no_update_news = true
    no_donation_nag = true

    # Permission enforcement stays off in M1 (0.56.2 default). When a later
    # hardening milestone enables it, grim and the portal need screencopy
    # grants, e.g.:
    #   permission = /usr/bin/grim, screencopy, allow
    #   permission = /usr/lib/xdg-desktop-portal-hyprland, screencopy, allow
    # enforce_permissions = false
}


# ── DESIGN LANGUAGE + KEYBOARD GRAMMAR ─────────────────────────────────────

source = ./punar-look.conf
source = ./punar-binds.conf
