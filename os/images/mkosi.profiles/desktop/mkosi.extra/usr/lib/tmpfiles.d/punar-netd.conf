# M12 network policy daemon. The socket itself is created 0660 root:punar;
# the runtime directory blocks peers outside that group before SO_PEERCRED.
d /run/punar-netd          0750 root punar -

# Relay preference only. Connection observations are change-only runtime data
# under /run and never become a durable history here.
d /var/lib/punar/network   0700 root root  -
