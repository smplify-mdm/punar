# punar-desktop: Milestone 1 graphical workstation profile.
#
# mkosi v26 profile (mkosi.profiles/desktop/): layered on top of the safe base
# os/images/mkosi.conf. It adds only product desktop packages and content.
# Development credentials, autologin, fixtures, mocks, and proof services live
# in the separately composable dev profile.
#
# Package set: EXACTLY the verified manifest of milestone-1.md §2.1 (all
# present in ALA snapshot 2026/08/20; versions verified 2026-08-24), plus
# nftables (1:1.1.6-3, verified in the snapshot's extra repo 2026-08-25 and
# absent from base's dependency chain — milestone-3.md §4.1) for punard's
# security.firewall capability. nftables.service is deliberately NOT enabled:
# punard owns the punar-base ruleset and applies it at boot reconcile.
#
# qt6-svg (6.11.2-1, 1056 KiB installed) is named EXPLICITLY as of the
# desktop-surfaces pass even though it adds ZERO bytes to the image: it is
# already a HARD dependency of both `quickshell` and `qt6-wayland`
# (verified against the pinned snapshot — `pacman -Qi qt6-svg` reports
# "Required By: qt6-wayland quickshell"). The wallpaper surface (Plate
# D-015) now loads /usr/lib/qt6/plugins/imageformats/libqsvg.so DIRECTLY,
# so leaving it to another package's dependency list would be an unstated
# assumption an upstream repackaging could silently break. A package we
# depend on by name is a package we notice losing. The package delta for
# the entire desktop-surface pass is this one line and 0 bytes: every other
# surface is QML inside the shell process that already runs, and the
# runtime tools they shell out to (wpctl from wireplumber, hyprctl from
# hyprland, punarctl from the workspace build, grim/slurp/jq) all ship
# already.
# Deliberately NOT shipped (see §2.1 rationale): vulkan-swrast, seatd daemon,
# tuigreet, uwsm, qemu-guest-agent, otf-geist-mono-nerd. The later physical-x86
# floor deliberately added firmware, microcode and Intel/AMD graphics support;
# its early-boot residency is bounded in the base image's module policy. Budget
# discipline per PERFORMANCE_BUDGETS.md: no GNOME/KDE stacks, no pulseaudio
# (pipewire-pulse shim only), nothing decorative.
#
# Desktop product content lands in this profile's mkosi.extra: versioned
# services/config plus generated Hyprland, foot, fontconfig, fonts, binaries,
# shell QML, themes, and OCI content. scripts/container-build.sh stages the
# generated paths from their source-of-truth trees. The dev profile overlays
# the autologin greeter, fixed account, mocks, fixtures, and test services.
# mkosi.postinst.chroot performs only product-safe finalization.

[Content]
# iwd is the Wi-Fi daemon: 2.2 MiB installed, depending only on glibc, readline
# and ell — against NetworkManager's far larger closure, for a machine that
# already has systemd-networkd doing addressing. iwd associates; networkd
# addresses. A primary development machine is a LAPTOP, and a laptop that
# cannot join a wireless network is stopped before anything else matters.
#
# xdg-utils (xdg-open / xdg-mime) is how one application asks the system to
# open a URL or a file — a terminal URL activation, a notification action, the
# command center's "open" verb. It was absent, so every such path failed with
# command-not-found while chromium sat installed and bound to PUNAR+B: a human
# could reach the browser, the SYSTEM could not.
#
# `file` is explicit because the wallpaper integrity gate verifies dimensions
# in addition to pinned digests on every architecture. Arch's base dependency
# chain already carries it today, so naming the contract adds no image bytes
# here and prevents an architecture adapter from silently omitting it.
#
# `whois` supplies mkpasswd, the pinned libxcrypt/yescrypt frontend. First run
# sends the password only on its anonymous stdin; Punar does not duplicate a
# password-hash implementation in a long-lived service.
#
# The live installer and the installed system use the same tree. Storage
# primitives stay in this product profile—not an installer-only overlay—so
# the tree written to slot A is byte-identical to live.erofs and can service
# its own encrypted/btrfs installation afterwards.
#
# The firmware, microcode and graphics packages are the bare-hardware floor
# for the supported Intel/AMD integrated-graphics matrix. They must be in every
# A/B slot: an image OS cannot repair a missing driver by mutating active root.
#
# Comments live HERE and never inside the Packages= block below: an indented
# line inside a multi-line value is a value CONTINUATION, so a "# ..." line in
# there would be parsed as a package name rather than ignored.
Packages=hyprland
         xdg-desktop-portal-hyprland
         xdg-desktop-portal-gtk
         xdg-desktop-portal
         quickshell
         qt6-svg
         greetd
         foot
         chromium
         git
         neovim
         geany
         thunar
         thunar-archive-plugin
         tumbler
         gvfs
         gvfs-smb
         ripgrep
         fd
         bat
         htop
         lsof
         strace
         podman
         crun
         netavark
         aardvark-dns
         pipewire
         pipewire-pulse
         wireplumber
         mesa
         polkit
         hyprpolkitagent
         noto-fonts
         noto-fonts-emoji
         grim
         slurp
         wl-clipboard
         # zram-generator: 768 KiB, depends only on systemd. Spec 282 and 294
         # mandate zram and the image shipped none, so there was no swap of any
         # kind and nothing was reclaimable under pressure.
         zram-generator
         iwd
         xdg-utils
         file
         jq
         nftables
         whois
         curl
         libarchive
         bubblewrap
         flatpak
         xdg-dbus-proxy
         cryptsetup
         btrfs-progs
         dosfstools
         gptfdisk
         linux-firmware
         sof-firmware
         intel-ucode
         amd-ucode
         vulkan-intel
         vulkan-radeon
         intel-media-driver
