# Debian's greetd unit is packaged for vt7, while Punar's shared configuration
# deliberately owns vt1. Declare that ownership to systemd so getty@tty1 is
# stopped before greetd opens the VT; otherwise both services race on tty1 and
# logind tears down the graphical session a few seconds after startup.
[Unit]
After=getty@tty1.service
Conflicts=getty@tty1.service
