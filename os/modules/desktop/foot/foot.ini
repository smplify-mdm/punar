# Punar foot terminal configuration — "field note" design language, Panel surface.
#
# Source of truth: docs/design/DESIGN_LANGUAGE.md section 6 (Surface assignment:
# "Terminal, code editors (default theme), plates/diagnostics, OSD overlays -> Panel";
# "Terminal palette v0" subsection) and the machine tokens in
# shell/theme/punar-tokens.json ("terminal" block, v0 draft).
# The scheme stays near-monochrome with lime #A3E047 as the single accent;
# blue/magenta/cyan slots are desaturated blue-grays pending Milestone 1 tuning.
#
# Installed system-wide as /etc/xdg/foot/foot.ini. foot (1.27.0) searches
# $XDG_CONFIG_HOME/foot/foot.ini (default ~/.config/foot/foot.ini), then
# $XDG_CONFIG_DIRS/foot/foot.ini (default /etc/xdg/foot/foot.ini) and loads
# only the FIRST file found — a per-user config fully replaces this one.

# Geist Mono is vendored in os/modules/desktop/fonts/geist-mono/
# (installed to /usr/share/fonts/punar/geist-mono/).
font=Geist Mono:size=10.5
pad=12x12

# The terminal is a Panel surface on BOTH user preferences (paper users still
# get panel terminals — DESIGN_LANGUAGE.md section 6), so foot's dark and
# light themes below are intentionally identical: the runtime theme toggle
# (color-theme-toggle / SIGUSR1/2) must never drop to foot's built-in light
# palette.
initial-color-theme=dark

[scrollback]
lines=10000

[colors-dark]
# Opaque Panel surface — solid surfaces per the design language, and no
# compositing cost at idle.
alpha=1.0
background=08090A
foreground=F2F3F5

# Cursor: text-under-cursor color, then cursor color — panel surface
# #08090A under a lime block (tokens: terminal.cursor).
cursor=08090A A3E047

# ANSI 0-7 (punar-tokens.json terminal.ansi):
# 0 black = panel edge, 1 red = panel bad, 2 green = panel ok (accent),
# 3 yellow = panel warn, 4/5/6 blue/magenta/cyan = desaturated v0 drafts,
# 7 white = panel fg.
regular0=26282E
regular1=FF7A7A
regular2=A3E047
regular3=F2BE85
regular4=8FA3C4
regular5=B0A8C4
regular6=8FBCC4
regular7=F2F3F5

# ANSI 8-15 (bright variants).
bright0=7B8290
bright1=FF9B9B
bright2=BCEA75
bright3=F7D2A8
bright4=AFC0DB
bright5=C8C0DB
bright6=AFD5DB
bright7=FFFFFF

[colors-light]
# Identical to colors-dark by design — see the note above initial-color-theme.
alpha=1.0
background=08090A
foreground=F2F3F5
cursor=08090A A3E047
regular0=26282E
regular1=FF7A7A
regular2=A3E047
regular3=F2BE85
regular4=8FA3C4
regular5=B0A8C4
regular6=8FBCC4
regular7=F2F3F5
bright0=7B8290
bright1=FF9B9B
bright2=BCEA75
bright3=F7D2A8
bright4=AFC0DB
bright5=C8C0DB
bright6=AFD5DB
bright7=FFFFFF

[bell]
# No bell in any form — the shell surfaces urgency, not the terminal.
urgent=no
notify=no
visual=no
