# Debian/amd64 package adapter for the shared Punar desktop product tree.
# This starts with the package-equivalent generic-UEFI surface already proven
# on Debian/ARM64. The product build composes the separate hardware-x86
# firmware/microcode profile; physical peripheral qualification remains a
# separate gate before this candidate can replace Arch.

# NO QML EFFECTS MODULE IS LISTED, and that is now a decision rather than an
# omission. LockSurface.qml used to import QtQuick.Effects for the lock's
# frosted wallpaper, which is why Debian needed the module named explicitly
# (Arch folds it into qt6-declarative). That import is gone: the software Qt
# Quick backend this image runs under implements no shader effects, so the
# effect drew nothing, and the frost is now produced by decoding the photograph
# small and letting the scaler stretch it. If a future surface imports
# QtQuick.Effects, Debian must name the module again — an unnamed import there
# does not degrade to a missing effect, the whole shell fails to load and every
# surface assertion reports "no running instances".
#
# NOTE FOR ANYONE EDITING THE LIST BELOW: no comment may appear inside
# `Packages=`. The substrate contract test collects that block with awk and
# stops at the first line that is not an indented non-comment entry, so an
# inline comment silently truncates the list and hides every package under it.

[Content]
Packages=hyprland
         xdg-desktop-portal-hyprland
         xdg-desktop-portal-gtk
         xdg-desktop-portal
         quickshell
         libqt6svg6
         qt6-wayland
         qml6-module-qt-labs-folderlistmodel
         greetd
         foot
         chromium
         chromium-sandbox
         ca-certificates
         git
         neovim
         geany
         thunar
         thunar-archive-plugin
         tumbler
         gvfs
         gvfs-backends
         ripgrep
         fd-find
         bat
         htop
         lsof
         strace
         podman
         crun
         catatonit
         netavark
         aardvark-dns
         passt
         slirp4netns
         uidmap
         util-linux
         passwd
         sudo
         tzdata
         pipewire
         pipewire-pulse
         wireplumber
         libgl1-mesa-dri
         polkitd
         # gnome-keyring: the freedesktop Secret Service
         # (org.freedesktop.secrets), without which NO third-party application
         # on this image can store a credential. Evolution's own Flatpak
         # metadata declares `org.freedesktop.secrets=talk`, so the mail client
         # in the catalogue re-prompts for its password every launch on an
         # image that has no provider — which is what shipped.
         #
         # D-BUS ACTIVATED, NEVER RESIDENT. Its user units carry [Install]
         # sections, so the preset disables them (user-preset/00-punar-lean)
         # and /usr/share/dbus-1/services/org.freedesktop.secrets.service
         # starts the daemon on first use. Nothing runs at idle and no .wants
         # link appears, which is the hypridle lesson applied ahead of time
         # rather than after release-image policy A9 fails.
         #
         # THIS IS NOT A KEYCHAIN, and docs/design/third-party-apps.md says so
         # in the same words: the Secret Service protocol has no per-application
         # access control, so every app that holds the bus name can read every
         # unlocked item. The enforcement point Punar actually has is the
         # sandbox — an app reaches the bus name only if its Flatpak metadata
         # asks for it, and the install card names it before you agree.
         gnome-keyring
         # Debian splits the PAM module out; Arch ships it inside gnome-keyring.
         # Without it the login keyring asks for a second password after the
         # one that just unlocked the machine.
         libpam-gnome-keyring
         hypridle
         hyprpolkitagent
         hyprland-qtutils
         fonts-noto-core
         fonts-noto-color-emoji
         grim
         slurp
         wl-clipboard
         xwayland
         systemd-zram-generator
         systemd-resolved
         systemd-userdbd
         systemd-timesyncd
         dbus-broker
         iwd
         wireless-regdb
         xdg-utils
         file
         jq
         nftables
         whois
         bash
         curl
         libarchive-tools
         bubblewrap
         flatpak
         xdg-dbus-proxy
         zstd
         systemd-cryptsetup
         cryptsetup
         btrfs-progs
         dosfstools
         gdisk

ExtraTrees=../../../mkosi.profiles/desktop/mkosi.extra
           mkosi.extra
