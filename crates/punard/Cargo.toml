[package]
name = "punard"
description = "Punar privileged local control-plane daemon (SPEC sections 10, 11.1, 41, 53, 60, 61) — Milestone 3: UDS NDJSON server, capability registry, audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clap = { workspace = true }
punar-common = { workspace = true }
# M4: the SPEC section 39 precedence/merge engine (layered desired state).
punar-policy = { workspace = true }
# The recovery-key wrapper is a library path inside the existing daemon, not
# another service. It contains the fixed RFC 9180 suite and receipt verifier.
punar-recovery = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# M9: the section 20 AI authority document is YAML (schemas/policy/
# ai-policy.json describes a YAML-authored file, and the shipped
# ai-defaults.yaml is that file). Already in the workspace tree for
# punar-env's ProjectEnvironment manifest — no new crate, no new
# transitives; justification lives at [workspace.dependencies].
serde_norway = { workspace = true }
thiserror = { workspace = true }
# Justifications for both live at the workspace [workspace.dependencies] table:
# rustix = SO_PEERCRED + pre-listen socket setup without unsafe;
# signal-hook = safe SIGTERM handling for graceful shutdown.
rustix = { workspace = true, features = ["process"] }
sha2 = { workspace = true }
signal-hook = { workspace = true }
# Installer passphrases and the optional first-boot passthrough are consumed
# from peer-owned descriptors and zeroized as soon as their transaction ends.
zeroize = { workspace = true }

[dev-dependencies]
# M10: the remote-query suite runs against a real punar-mock-smplify
# instance on a tempdir socket — the same binary the image ships, not a
# second in-test copy of the control-plane protocol.
punar-mock-smplify = { workspace = true }
