# Persistent state shared by both immutable OS slots. Production installation
# renders the encrypted overlay over this file; ordinary dev images keep the
# same mount shape unencrypted so every boot exercises persistence boundaries.
[Partition]
Type=linux-generic
UUID=21d4af4f-a19c-4c6a-b4e8-dd50e9f7ecb9
Label=PUNAR-DATA
Format=btrfs
MakeDirectories=/@var /@home /@var-tmp
Subvolumes=/@var /@home /@var-tmp
SizeMinBytes=16G
Weight=1000
MountPoint=/var:"subvol=@var,compress=zstd:1,noatime"
MountPoint=/home:"subvol=@home,compress=zstd:1,noatime"
MountPoint=/var/tmp:"subvol=@var-tmp,compress=zstd:1,noatime,nosuid,nodev"
