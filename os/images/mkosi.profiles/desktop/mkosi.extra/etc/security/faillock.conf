# faillock.conf — Punar's stated lockout policy for the session lock.
#
# WHY THIS FILE EXISTS. `etc/pam.d/punar-lock` has always included
# pam_faillock, which is correct: rate-limiting a passphrase-guessing attack
# against an unattended locked screen is precisely what that surface is for.
# But the image shipped no faillock.conf, so the policy was whatever Arch's
# built-in defaults happened to be — deny=3, unlock_time=600. A machine whose
# account-lockout policy is "whatever the distribution decided" cannot state
# its own security posture, and nothing in the tree said what would happen.
#
# THE FAILURE THIS CAUSED, observed on a real machine (2026-09-06): three
# mistyped passphrases silently locked the account for ten minutes, and the
# lock surface reported "Try again" — the same words as a wrong passphrase,
# because pam_faillock's preauth denial returns PAM_AUTH_ERR and not
# PAM_MAXTRIES. The user concluded their password was broken. On hardware with
# LUKS that conclusion ends in a wipe, so an unlabelled lockout is not a
# cosmetic problem; it is shaped like data loss.
#
# THE NUMBERS, and why these and not Arch's.
#
#   deny = 5           Three is too few for a human typing a passphrase of the
#                      length onboarding asks for (10+ characters, no symbol
#                      rules) on an unfamiliar keyboard layout. Five still
#                      bounds an attacker to 60 guesses/hour with the window
#                      below, which against a 10-character passphrase is not
#                      the control doing the work — passphrase strength is.
#                      Locking a legitimate owner out of their own machine is
#                      a real cost paid every time; the marginal security
#                      between three and five guesses per five minutes is not.
#
#   unlock_time = 300  Five minutes: long enough that sustained guessing is
#                      pointless, short enough that a person who fat-fingered
#                      their passphrase can wait it out rather than conclude
#                      the machine has eaten their data.
#
#   fail_interval=900  Failures older than fifteen minutes do not count toward
#                      the streak. Without this, three typos spread across a
#                      whole day accumulate into a lockout that arrives with no
#                      apparent cause at all.
#
# NOT SET, deliberately: `silent` stays off so a lockout reaches the journal
# and an administrator can see it happened; `even_deny_root` is irrelevant
# here because this stack authenticates the session's own unprivileged user
# and root never unlocks a screen.
#
# The shell reads THIS FILE to phrase what it tells the reader, so the numbers
# above and the words on the lock screen cannot drift apart.

deny = 5
unlock_time = 300
fail_interval = 900
