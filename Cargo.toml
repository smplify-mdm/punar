# Punar workspace — crates per SPEC_v0.2.md section 67.
#
# Milestone 0 scope: compiling, tested foundation stubs. Daemon/CLI behavior
# arrives in Milestone 3+ (SPEC section 76); nothing here pretends otherwise.

[workspace]
resolver = "3"
members = [
    "crates/punar-agentd",
    "crates/punar-common",
    "crates/punar-env",
    "crates/punar-mock-smplify",
    "crates/punar-netd",
    "crates/punar-onboard",
    "crates/punar-policy",
    "crates/punar-recovery",
    "crates/punar-secrets",
    "crates/punar-workspace",
    "crates/punarctl",
    "crates/punard",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# Internal crates
punar-common = { path = "crates/punar-common" }
# dev-only counterparty: M10's punard suite drives the *real* dev/CI mock
# control plane over a tempdir socket, so the courier path is exercised
# against the binary the image ships rather than a second in-test
# reimplementation of the same protocol (milestone-10.md section 7).
punar-mock-smplify = { path = "crates/punar-mock-smplify" }
punar-policy = { path = "crates/punar-policy" }
punar-recovery = { path = "crates/punar-recovery" }

# External
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
# rustix (M3, docs/development/milestone-3.md section 3): SO_PEERCRED and
# bind-before-listen for punard's UDS. std's peer_cred is unstable; libc would
# need `unsafe` (workspace crates are #![forbid(unsafe_code)]); nix is larger.
# Feature-gated to `net` + (M7) `fs`; transitives (bitflags, linux-raw-sys)
# pinned by Cargo.lock. M7 adds `fs` for `flock` behind punar-common's audit
# rotation lock (docs/api/ipc.md section 10.4), now that punard and
# punar-agentd append to one trail — same crate, no new transitives.
rustix = { version = "1", features = ["net", "fs"] }
# signal-hook (M3): safe SIGTERM/SIGINT handling for punard graceful shutdown
# (M7: punar-agentd shuts down the same way).
# sigaction is not reachable from safe std or safe rustix; signal-hook is the
# standard safe wrapper (transitives: libc, signal-hook-registry — the unsafe
# stays in the audited dependency, not in Punar crates).
signal-hook = "0.3"
# serde_norway (M6, docs/development/milestone-6.md section 4.2): YAML parsing
# for the ProjectEnvironment manifest (SPEC section 17). Maintained
# continuation of serde_yaml (archived by its author in March 2024), drop-in
# serde API; the `unsafe` it inherits (the unsafe-libyaml translation) stays
# in the audited dependency, not in Punar crates — the signal-hook/rustix
# stance above. Advisory-checked at vendoring (no RUSTSEC entries for
# serde_norway or unsafe-libyaml-norway as of 2026-08); documented fallback
# per the M6 plan: pin the frozen serde_yaml 0.9.34+deprecated.
serde_norway = "0.9"
# First-run identity is one of the few places a plaintext authenticator exists
# in memory. zeroize keeps that boundary explicit; the unsafe volatile write
# stays inside the audited dependency, as with rustix and signal-hook above.
zeroize = "1"
# Device display names are counted as human-visible grapheme clusters and
# normalized before deriving an RFC-1123 hostname. These crates are pure Rust
# and add no resident process or runtime service.
unicode-normalization = "0.1"
unicode-segmentation = "1"
# Recovery escrow is RFC 9180 HPKE, not a Punar cryptographic construction.
# Pin the patch because the upstream crate explicitly reserves patch-level
# changes in its `danger` API; Punar does not use that module, but an exact
# security dependency is easier to audit. Disable the default post-quantum
# suites: this protocol fixes one reviewed suite and does not negotiate.
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "getrandom", "chacha", "x25519"] }
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = "0.4"
