# Punar CI — Milestones 0–8 (spec 76: M0 "reproducible build and VM boot",
# M1 "idle RAM measured" graphical acceptance, M2 multitasking exercise,
# M3 daemon/typed-IPC/capability/audit exercise, M4 policy-merge/explain/
# drift-remediation exercise, M5 mock-control-plane enrollment/policy/
# compliance/inventory exercise, M6 punar-env developer-environment
# exercise, M7 AI agent registry exercise, M8 AI Access Ledger exercise;
# ADR-001, milestone-1.md §10,
# milestone-2.md §7, milestone-3.md §8–§9, milestone-4.md §10,
# milestone-5.md §10, milestone-6.md §10, milestone-7.md §12,
# milestone-8.md §12).
#
# Jobs:
#   rust          fmt + clippy(-D warnings) + tests for the Cargo workspace
#   contracts     JSON Schemas + fixtures validation
#   image         containerized mkosi build of BOTH qcow2s — punar-dev
#                 (minimal M0) and punar-desktop (M1) — via
#                 tools/build-image.sh. Both are built on every run
#                 (milestone-1.md §3/§10): the minimal build is small and
#                 shares the pacman package cache with the desktop build, and
#                 the M0 boot gate must stay regression-isolated per PR.
#   boot-test     QEMU/OVMF boot smoke test of punar-dev (PUNAR_BOOT_OK)
#   desktop-test  M1–M8 graphical gate on punar-desktop: PUNAR_DESKTOP_OK,
#                 in-guest canonical idle-RAM measurement + services-RSS
#                 sample (summed PSS over the punard.service and, since M7,
#                 punar-agentd.service cgroups — one COMBINED number, the
#                 thresholds unchanged), then the
#                 in-guest M2 multitasking exercise (milestone-2.md §7 —
#                 punar-m2-check.service, verdict in m2-report.txt) and the
#                 in-guest M3 daemon/CLI exercise (milestone-3.md §8 —
#                 punar-m3-check.service: socket perms, typed IPC, authz
#                 denial voice, audit schema, firewall drift/apply, no-exec
#                 probe; verdict in m3-report.txt) and the in-guest M4
#                 policy exercise (milestone-4.md §10 — punar-m4-check.service:
#                 policy effective/explain provenance, preference-layer set
#                 cycle, section 52 compliance, timer-driven firewall-drift
#                 demo via punard-reconcile.timer; verdict in m4-report.txt)
#                 and the in-guest M5 enrollment exercise (milestone-5.md
#                 §10 — punar-m5-check.service: starts/stops the
#                 never-enabled punar-mock-smplify dev/CI mock, runs the
#                 enroll -> managed -> offline -> unenroll journey with
#                 category-only compliance/inventory asserted on the mock's
#                 received side, captures the enrolled/personal bar
#                 screenshots; verdict in m5-report.txt) and the in-guest
#                 M6 developer-environment exercise (milestone-6.md §10 —
#                 punar-m6-check.service: punar-env as the punar user
#                 against rootless podman — preloaded offline base image,
#                 init idempotence, up with --network none + the
#                 /workspace bind, shell exit-code passthrough, D-014
#                 status with declared/enforcement labels verbatim, agent
#                 stub honesty, destroy; verdict in m6-report.txt) and the
#                 in-guest M7 AI agent registry exercise (milestone-7.md
#                 §12 — punar-m7-check.service: punar-agentd daemon/socket
#                 preflight, a MOCK managed session through `punar-env agent
#                 claude-code` (the offline VM has no real agent binary, and
#                 the stand-in labels itself), registry truth in the
#                 schema-exact registry.jsonl, scope-cgroup attribution,
#                 `punarctl agents inspect`, a real innocuous process
#                 detected as UNKNOWN/SUSPECTED, agents.json, the AI-panel
#                 screenshot, end of life, audit lifecycle lines and
#                 negative probes on the new socket; verdict in
#                 m7-report.txt) and the in-guest M8 AI Access Ledger
#                 exercise (milestone-8.md §12 — punar-m8-check.service:
#                 a managed mock session whose child processes are
#                 generated deterministically (fifo-blocked shell + git,
#                 plus one short-lived capability call punard denies), the
#                 scope cgroup read straight from /sys/fs/cgroup, the
#                 schema-exact agents.access summary with honest
#                 not-yet-observed rows for the categories no mediation
#                 point observes yet (network M12, MCP M9+, credentials
#                 M9), the Level-4 denial joined to the audit trail by
#                 event id, the privacy regression asserting no path, argv
#                 or comm ever reached disk, the counts-only agents.list
#                 fingerprint, the AI-panel screenshot, the 14-day
#                 retention deadline, an owner purge and its tombstone,
#                 the no-resurrection drain, a retention prune against an
#                 injected backdated ledger, and negative probes proving
#                 no export path exists; verdict in m8-report.txt) and the
#                 in-guest M10 shadow-AI exercise (milestone-10.md §16 —
#                 punar-m10-check.service: periodic detection fired by the
#                 240 s timer with NO manual scan in the window, exactly
#                 one alert per signature across passes, a clear and a
#                 restart, the Plate D-009 alert card screenshot, the
#                 do-not-disturb breakthrough, the unknown-agent ledger
#                 re-validated on the host against
#                 schemas/ai-agent/ledger-summary.json, an authorized
#                 admin query answered within one reconcile pass over a
#                 path with no inbound listener, an out-of-scope query
#                 refused by the DEVICE and audited, the query log printed
#                 by the unprivileged user, both personal-device gates
#                 proven separately, and the fleet view's `—` where nobody
#                 answered; verdict in m10-report.txt; all hard-gated in
#                 boot-test.sh),
#                 artifact export
#                 (tools/boot-test.sh --mode desktop), then the
#                 PERFORMANCE_BUDGETS.md gates
#                 (tests/performance/check-budgets.sh: whole-system fail
#                 mean > 1536 MB / warn > 1024 MB; services fail > 150 MB /
#                 warn > 100 MB, absent fails even under TCG; other TCG
#                 breaches warn-only, labeled emulated)
#
# Runner pin: ubuntu-24.04, NOT ubuntu-latest — GitHub is migrating -latest
# labels toward 26.04 during 2026 (research/crosscutting.md §2.1); an OS
# image build should not float. Standard public-repo runners are 4 vCPU /
# 16 GB RAM / 14 GB SSD and expose /dev/kvm (permission granted via the udev
# rule below, the pattern used by systemd's mkosi CI and the Android
# emulator ecosystem). x86_64 CI is the canonical build environment; the
# maintainer's arm64 Mac only runs the same containerized path under
# emulation (docs/development/image-pipeline.md).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Org Actions policy (and Punar's own supply-chain posture, spec 59.6)
      # allows GitHub-owned actions only — no third-party toolchain/cache
      # actions. rustup ships preinstalled on hosted runners.
      - name: Install Rust toolchain (stable, rustfmt + clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  contracts:
    name: contracts (schemas + fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Validates all JSON Schemas (draft 2020-12) and every example/fixture
      # against them, including the 45 negative fixtures, in a pinned python
      # container. See tests/unit/schemas-validation.md.
      - name: Validate schemas and fixtures
        run: ./tools/validate-schemas.sh

  image:
    name: image (mkosi, containerized)
    runs-on: ubuntu-24.04
    # Raised from M0's 45: the desktop profile adds chromium/qt6/mesa
    # (larger pacman download + a substantially larger qcow2 to compress and
    # upload; size is an estimate until the first run — milestone-1.md §3).
    # Since M3 the desktop build also compiles punard/punarctl in-container
    # (native x86_64 release build, a few minutes cold, ~nothing warm —
    # the cargo cache rides os/images/cache). To be tightened once real run
    # times exist.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Pinned shellcheck container — same tool and version as local dev
      # (ubuntu's apt shellcheck 0.9.x drifts: SC2317 false-positives on
      # trap-invoked cleanup). Local/CI parity over distro convenience.
      # Package cache for the pinned snapshot — one good run fills it, after
      # which builds pull ~nothing from archive.archlinux.org (which throttles
      # large pulls). Since M3 the same directory also carries CARGO_HOME +
      # the cargo target dir for the in-container punard/punarctl build
      # (milestone-3.md §7), so the key includes Cargo.lock; the restore-key
      # prefix keeps the snapshot pin as the cache boundary (new pin = new
      # cache, a lock change reuses the same snapshot's packages).
      - name: Cache mkosi package downloads and cargo build
        uses: actions/cache@v4
        with:
          path: os/images/cache
          key: mkosi-pkgs-${{ hashFiles('os/images/snapshot.env') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: mkosi-pkgs-${{ hashFiles('os/images/snapshot.env') }}-

      # The shell is ~40 QML files and had NO automated lint anywhere in CI —
      # it had only ever been run by hand. A QML defect does not fail the
      # build (mkosi copies the files in verbatim); it appears at runtime as a
      # surface that refuses to open, which surfaces-check.sh catches ~40
      # minutes into a run. This catches it in about a minute, against the
      # same Qt/Quickshell the image ships.
      - name: Lint the shell QML (qmllint, pinned to the image's Qt/Quickshell)
        run: ./tools/qmllint.sh

      - name: Lint pipeline shell scripts (shellcheck, pinned)
        run: |
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0 \
            tools/build-image.sh tools/boot-test.sh \
            os/images/scripts/container-build.sh \
            tests/performance/check-budgets.sh \
            os/modules/desktop/hypr/punar-layout.sh \
            os/images/mkosi.profiles/desktop/mkosi.extra/usr/lib/punar/idle-ram.sh \
            os/images/mkosi.profiles/desktop/mkosi.extra/usr/lib/punar/surfaces-check.sh \
            os/images/mkosi.profiles/desktop/mkosi.extra/usr/lib/punar/m2-check.sh \
            os/images/mkosi.profiles/desktop/mkosi.extra/usr/lib/punar/m3-check.sh \
            os/images/mkosi.profiles/desktop/mkosi.extra/usr/lib/punar/m4-check.sh \
            os/images/mkosi.profiles/desktop/mkosi.extra/usr/lib/punar/m5-check.sh \
            os/images/mkosi.profiles/desktop/mkosi.extra/usr/lib/punar/m6-check.sh \
            os/images/mkosi.profiles/desktop/mkosi.extra/usr/lib/punar/m7-check.sh \
            os/images/mkosi.profiles/desktop/mkosi.extra/usr/lib/punar/m8-check.sh \
            os/images/mkosi.profiles/desktop/mkosi.extra/usr/lib/punar/m9-check.sh \
            os/images/mkosi.profiles/desktop/mkosi.extra/usr/lib/punar/m10-check.sh \
            os/images/mkosi.profiles/desktop/mkosi.extra/usr/lib/punar/in-agent-scope.sh \
            os/images/mkosi.profiles/desktop/mkosi.extra/usr/lib/punar/punar-mock-agent \
            os/images/mkosi.profiles/desktop/mkosi.extra/usr/lib/punar/foo-agent-fixture.sh

      - name: Build punar-dev + punar-desktop images (containerized mkosi)
        run: ./tools/build-image.sh all

      # SHA256SUMS covers both qcow2s; each artifact carries a copy and the
      # consumers verify with --ignore-missing against the files they have.
      - name: Upload minimal image artifact
        uses: actions/upload-artifact@v4
        with:
          name: punar-dev-image
          path: |
            os/images/out/punar-dev-x86_64.qcow2
            os/images/out/SHA256SUMS
            os/images/out/build-info.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload desktop image artifact
        uses: actions/upload-artifact@v4
        with:
          name: punar-desktop-image
          path: |
            os/images/out/punar-desktop-x86_64.qcow2
            os/images/out/SHA256SUMS
            os/images/out/build-info.txt
          if-no-files-found: error
          retention-days: 7

  boot-test:
    name: boot-test (QEMU smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: image
    steps:
      - uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: punar-dev-image
          path: os/images/out

      - name: Install QEMU and OVMF firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      # Hosted Linux runners have /dev/kvm but the runner user lacks
      # permission by default; this udev rule is the canonical fix
      # (research/crosscutting.md §2.1). If KVM is still unavailable,
      # tools/boot-test.sh degrades to TCG with a ::warning:: annotation
      # rather than failing.
      - name: Enable KVM access for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot smoke test (serial console marker)
        run: ./tools/boot-test.sh os/images/out/punar-dev-x86_64.qcow2

      # --ignore-missing: SHA256SUMS lists both images but this job only
      # downloads punar-dev (GNU coreutils still fails if nothing verifies).
      - name: Verify artifact checksum
        run: |
          cd os/images/out
          sha256sum -c --ignore-missing SHA256SUMS

  # M1..M8 graphical acceptance gate (milestone-1.md §7–§10,
  # milestone-2.md §7, milestone-3.md §8, milestone-4.md §10,
  # milestone-5.md §10, milestone-6.md §10, milestone-7.md §12,
  # milestone-8.md §12). Boots the desktop image with
  # -m 8192 -smp 4
  # -device virtio-vga + the punar.export virtio-serial channel, waits for
  # PUNAR_DESKTOP_OK, then for the in-guest canonical idle-RAM measurement
  # (10 min stabilize + 5 min window — PERFORMANCE_BUDGETS.md §2.1–2.2,
  # ~16 min wall clock), then the guest runs the M2..M8 exercises in order
  # (each strictly AFTER sampling, so the idle numbers
  # stay clean; the M5 exercise starts/stops the never-enabled
  # punar-mock-smplify dev/CI mock itself; the M6 exercise's rootless
  # containers exist only inside its window; the M7 and M8 agent sessions
  # live in their own user-manager scopes, in no service cgroup) and
  # exports screenshots + RAM
  # data + the reports; boot-test.sh hard-fails on any delivered
  # PUNAR_M2/M3/M4/M5/M6/M7/M8_FAIL verdict, and the RAM numbers gate
  # against the budgets.
  # ~105 min covers KVM boot + measurement + the seven exercises (the M4
  # drift demo waits on wall-clock timer firings, worst case 375 s; the M5
  # exercise adds a few minutes of reconcile RPCs and bounded waits; the
  # M6 exercise adds seconds under KVM — podman load of a ~1.3 MB archive,
  # one container, a handful of execs; the M7 exercise adds a minute or two
  # — one mock agent session, one detection fixture, one panel screenshot;
  # the M8 exercise adds a minute or two more — a second mock session with
  # generated children, one panel screenshot and one deliberate
  # punar-agentd restart for the retention-prune assertion)
  # + export; a TCG-degraded run
  # (broken KVM) will exceed it — that failure
  # mode is intentional surfacing; the RAM gate is warn-only under TCG, and
  # a MISSING report is warn (KVM) / info (TCG) — though a delivered FAIL
  # always fails.
  # "No mouse required" (the other M1/M2 acceptance criterion) is not
  # CI-provable: it is a human keyboard-only walkthrough, with the keybind
  # config baked into the image as the CI-checkable proxy (milestone-1.md §10,
  # keyboard-grammar.md walkthrough steps 16–23 for M2).
  desktop-test:
    name: desktop-test (graphical gate + M2..M10 exercises + RAM budgets)
    runs-on: ubuntu-24.04
    # Raised from M9's 125: the in-guest M10 exercise
    # (punar-m10-check.service, bounded at 15 min in-guest) runs between the
    # M9 exercise and the export. Its one unavoidable wait is 300 s — the
    # 240 s scan period plus 30 s AccuracySec plus slack — because the
    # detection group waits for punar-agentd-scan.timer to fire ON ITS OWN,
    # with no manual scan anywhere in the window; the later groups run
    # inside that wait, so the incremental cost is the remainder. A timer
    # firing is wall clock, so it costs the same under TCG as under KVM.
    # boot-test.sh's KVM export timeout goes from 3600 s to 4200 s to keep
    # the same headroom.
    timeout-minutes: 135
    needs: image
    steps:
      - uses: actions/checkout@v4

      - name: Download desktop image artifact
        uses: actions/download-artifact@v4
        with:
          name: punar-desktop-image
          path: os/images/out

      - name: Install QEMU and OVMF firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      # Same canonical udev fix as boot-test; tools/boot-test.sh degrades to
      # TCG with a ::warning:: if KVM is still unavailable.
      - name: Enable KVM access for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Verify before the long boot so a corrupt download fails fast.
      - name: Verify artifact checksum
        run: |
          cd os/images/out
          sha256sum -c --ignore-missing SHA256SUMS

      - name: Desktop gate (PUNAR_DESKTOP_OK + idle-RAM + M2..M9 exercises + export)
        run: ./tools/boot-test.sh --mode desktop os/images/out/punar-desktop-x86_64.qcow2

      - name: Idle-RAM budget gate (PERFORMANCE_BUDGETS.md)
        run: ./tests/performance/check-budgets.sh os/images/out/desktop-proof/ram-report.txt

      # Uploads run even when a gate failed — the serial log and any partial
      # proof files are the primary diagnostics. The screenshot is warn-only:
      # the guest deliberately continues without one (grim failure is itself
      # a signal), and boot-test already annotated its absence.
      - name: Upload desktop screenshots (M1 idle + M2 overview + M5 enrolled/personal + M7 AI panel + M8 ledger register + M9 approval gate + M10 shadow-AI alert + every shell surface)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: punar-desktop-screenshot
          path: |
            os/images/out/desktop-proof/punar-desktop-screenshot.png
            os/images/out/desktop-proof/punar-m2.png
            os/images/out/desktop-proof/punar-m5.png
            os/images/out/desktop-proof/punar-m5-personal.png
            os/images/out/desktop-proof/punar-m7.png
            os/images/out/desktop-proof/punar-m8.png
            os/images/out/desktop-proof/punar-m9.png
            os/images/out/desktop-proof/punar-m10.png
            os/images/out/desktop-proof/surfaces-*.png
          if-no-files-found: warn
          retention-days: 7

      # m5-*.txt covers m5-report.txt plus the human explain/denial
      # captures; m5-received-*.jsonl are the mock control plane's
      # received-state copies (the category-only compliance/inventory
      # privacy evidence — milestone-5.md §6; never devices.json, which
      # holds the server-side token record).
      # m6-*.txt covers m6-report.txt, the D-014 status render and the
      # podman-ps snapshot; m6-*.json are the status --json object and the
      # podman info/inspect evidence (milestone-6.md §10 — no screenshots,
      # this is a CLI milestone).
      # m7-*.txt covers m7-report.txt plus the agent launch block and the
      # inspect/list renders; m7-*.json are the agents list/scan snapshots
      # and the copy of /run/punar/agents.json; m7-registry.jsonl is the
      # schema-exact transition log for this boot's session (the M7
      # screenshot rides the screenshot artifact above).
      # m8-*.txt covers m8-report.txt plus the launch block (with its
      # labelled dev/CI child generation), the privacy ledger render and
      # the purge render; m8-*.json are the agents.access result, the
      # stored ledger record, index.json before and after the retention
      # prune, the panel's runtime view and the attributed audit denial
      # the Level-4 join is proven against (the M8 screenshot rides the
      # screenshot artifact above). No ledger artifact carries a workspace
      # path, an argv or a comm — that is asserted in-guest by m8-check
      # group 8, so these uploads are safe to read (milestone-8.md §12).
      # m9-*.txt covers m9-report.txt plus the launch block, the
      # approval_required / denial renders, the credential CARDS (stderr
      # only — the value goes to stdout and is captured into a shell
      # variable that is never written anywhere) and the redaction sweep's
      # COUNTS; m9-*.json are the approvals list/get objects, the exported
      # approval document boot-test phase 11 re-validates against
      # schemas/audit/approval.json, the agents.access result showing the
      # M8 ledger's credential rows filled in, and the audit slices both
      # pointer directions are proven against (the M9 screenshot rides the
      # screenshot artifact above). No M9 artifact carries a credential
      # value: m9-check group 9 greps every one of these files — this very
      # tar — for both issued tokens before the export is built, with a
      # negative control proving the grep would have found one
      # (milestone-9.md §12).
      # m10-*.txt covers m10-report.txt plus the alert register render, the
      # dismissal render, the query log the UNPRIVILEGED user printed, the
      # purge render and the mock's fleet text (the one artifact where `—`
      # versus `0` is the assertion); m10-*.json are the agents.json and
      # alerts.json snapshots, the alert register, the detection ledger
      # summary boot-test phase 12b re-validates against
      # schemas/ai-agent/ledger-summary.json, the answered and refused
      # query documents, and the local query log; m10-*.jsonl are the
      # schema-exact detection transition records and the mock's
      # received-answers log (the M10 screenshot rides the screenshot
      # artifact above). No M10 artifact carries a prompt, a command line,
      # a cwd or a network destination — the exported query documents carry
      # zone CLASSES, never paths, and that is asserted in-guest by
      # m10-check groups 6-8 (milestone-10.md §8.3, §16).
      - name: Upload RAM report, M2..M10 reports and measurement data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: punar-desktop-ram-report
          path: |
            os/images/out/desktop-proof/ram-report.txt
            os/images/out/desktop-proof/ram-samples.txt
            os/images/out/desktop-proof/meminfo
            os/images/out/desktop-proof/surfaces-report.txt
            os/images/out/desktop-proof/surfaces-*.json
            os/images/out/desktop-proof/surfaces-*.txt
            os/images/out/desktop-proof/m2-report.txt
            os/images/out/desktop-proof/m2-*.json
            os/images/out/desktop-proof/m3-report.txt
            os/images/out/desktop-proof/m3-*.json
            os/images/out/desktop-proof/m3-deny-stderr.txt
            os/images/out/desktop-proof/m4-report.txt
            os/images/out/desktop-proof/m4-*.json
            os/images/out/desktop-proof/m4-explain-*.txt
            os/images/out/desktop-proof/m5-report.txt
            os/images/out/desktop-proof/m5-*.json
            os/images/out/desktop-proof/m5-*.jsonl
            os/images/out/desktop-proof/m5-*.txt
            os/images/out/desktop-proof/m6-report.txt
            os/images/out/desktop-proof/m6-*.json
            os/images/out/desktop-proof/m6-*.txt
            os/images/out/desktop-proof/m7-report.txt
            os/images/out/desktop-proof/m7-*.json
            os/images/out/desktop-proof/m7-*.jsonl
            os/images/out/desktop-proof/m7-*.txt
            os/images/out/desktop-proof/m8-report.txt
            os/images/out/desktop-proof/m8-*.json
            os/images/out/desktop-proof/m8-*.txt
            os/images/out/desktop-proof/m9-report.txt
            os/images/out/desktop-proof/m9-*.json
            os/images/out/desktop-proof/m9-*.txt
