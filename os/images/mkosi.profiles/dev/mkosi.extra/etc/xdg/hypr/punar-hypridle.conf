# CI/dev override of the shipped idle policy. NOT the product's.
#
# The product locks an unattended session after ten minutes
# (os/modules/desktop/hypr/punar-hypridle.conf). That is correct on a desk and
# fatal in a gate: the desktop exercises run after the canonical sixteen-minute
# idle-RAM measurement, so by the time M2 reaches its window tests the session
# has been idle far longer than the timeout. hypridle locks, ext-session-lock
# takes the session, `hyprctl activewindow` returns null, and every assertion
# that needs a focused window fails — grouping, floating, pinning. The exercise
# was not wrong and neither was the lock; a measurement window is simply
# indistinguishable from a user who walked away.
#
# So this image does not auto-lock. The dev profile already deviates on exactly
# this axis — it autologins, which the release image refuses and
# check-release-image.sh assertion A4 enforces — so keeping the CI session
# unlocked is consistent with what this image is for.
#
# WHAT STILL GETS PROVEN, and where:
#   - the mechanism (the compositor really delivers ext-idle-notify to a
#     hypridle client) — surfaces-check.sh group 9, with a throwaway
#     two-second listener, in THIS image;
#   - the product policy (bounded timeout, routed to the Punar lock surface)
#     — check-release-image.sh, against the RELEASE tree, where the file below
#     is not overridden.
# Asserting the product's timeout from inside this image would only ever prove
# this override.

general {
    lock_cmd = qs -p /usr/share/punar/shell ipc call lock lock
    before_sleep_cmd = loginctl lock-session
}

listener {
    # A day. Long enough that no gate reaches it, and still a real listener, so
    # the idle path is wired exactly as it is in the product.
    timeout = 86400
    on-timeout = loginctl lock-session
}
