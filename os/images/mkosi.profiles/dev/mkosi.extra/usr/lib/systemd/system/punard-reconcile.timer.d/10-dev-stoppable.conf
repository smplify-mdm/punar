# Dev/CI image only (release check A5 refuses this file): the in-VM
# exercises stop punard-reconcile.timer so every pass they assert on is their
# own, and restart it when they are done. A release image refuses an
# administrator's stop of the timer (RefuseManualStop=yes in the vendor unit,
# docs/development/smplify-enrollment.md section 3.4).
[Unit]
RefuseManualStop=no
