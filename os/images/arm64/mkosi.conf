# Punar native ARM64 migration image.
#
# This is a deliberately minimal, boot-gated lane. It proves one reproducible
# Debian snapshot can produce a native aarch64 UEFI image before the complete
# desktop profile moves off the x86_64-only Arch substrate. It is not a
# Raspberry Pi image: QEMU's SBSA-style `virt` machine and the Pi firmware boot
# chain are different platforms, and ADR-006 owns the latter.

[Distribution]
Distribution=debian
Release=unstable
Architecture=arm64

[Output]
Format=disk
ImageId=punar-dev-arm64
OutputDirectory=../out
# The migration artifact is the bootable disk. UKI/kernel/initrd copies remain
# available inside it and only duplicate hundreds of MiB beside the qcow2.
SplitArtifacts=
Seed=46b206c3-e628-4131-9339-28bb2a86d10f

[Build]
CacheDirectory=../cache/debian-arm64

[Content]
# systemd-sysv supplies /sbin/init on Debian. systemd-boot-efi supplies the
# native AA64 bootloader, and linux-image-arm64 selects Debian's signed arm64
# kernel metapackage from the pinned sid snapshot.
Packages=systemd
         systemd-sysv
         systemd-boot-efi
         linux-image-arm64
         mount
RemoveFiles=/var/cache/ldconfig/aux-cache
            /var/log/*
Bootable=yes
Bootloader=systemd-boot

# mkosi 26's built-in Debian initrd names util-linux but Debian split mount(8)
# into its own package. Without this explicit initrd package, firmware reaches
# the UKI but the initrd cannot mount the real root. This is an upstream
# compatibility adapter, not a target-image convenience dependency.
InitrdPackages=mount

# ttyAMA0 is QEMU `virt`'s PL011 serial device. Keep tty0 first and serial last
# so the boot marker reaches the headless CI console.
# Same slot-selection contract as x86_64: the UKI and selected root cannot
# drift because the literal root-A PARTUUID lives inside the UKI itself.
KernelCommandLine=console=tty0 console=ttyAMA0 root=PARTUUID=1beabfe0-9cb8-4b49-91ef-d372b845e7ea rw

# Reuse the architecture-neutral boot marker already exercised by x86_64.
ExtraTrees=../mkosi.extra

# Development-image access only. Production onboarding replaces this with a
# transactional account creation flow; no shipping image may retain autologin.
Autologin=yes
# A literal password makes systemd-firstboot choose a new crypt salt on every
# build, changing /etc/shadow, the initrd credential and therefore the UKI.
# This fixed SHA-512 crypt is for the documented dev password "punar" only.
# Production images do not carry a root password at all.
RootPassword=hashed:$6$punar-arm64-dev$gWTgk1f0Vl76wHmu/qPIXM89H0xcFqIkBBj9DEPteme3zLnOiSlzdNK/fp4y4jowrT0WWdFFdhUFHC5.Ejxe3/
Hostname=punar-dev-arm64
Locale=C.UTF-8
Timezone=UTC
