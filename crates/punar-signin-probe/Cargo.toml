[package]
name = "punar-signin-probe"
description = "dev/CI harness — not a product component. Signs the calling account in through a PAM service's whole stack, as greetd does at a password sign-in, for the desktop gate's keyring check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The crate and pin punar-auth already carries for the same C API, with the
# same reasoning (crates/punar-auth/Cargo.toml): nothing new is locked.
pam-client2 = { version = "=0.5.5", default-features = false }
zeroize = { workspace = true }
