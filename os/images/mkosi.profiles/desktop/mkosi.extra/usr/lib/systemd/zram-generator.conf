# Punar compressed swap.
#
# SPEC-MANDATED AND, UNTIL NOW, ABSENT. Spec section 282 says "Use zram,
# memory-pressure-aware service behavior, cgroups, and per-project limits where
# useful. On 8 GB systems, prioritize developer applications over decorative OS
# effects", and section 294 asks for "aggressive zram". Neither was implemented:
# the image shipped no zram at all, so the machine had no swap of any kind and
# reclaimed nothing under pressure.
#
# It matters most exactly where Punar is going. A Raspberry Pi appliance running
# inference has no disk swap worth using and every megabyte belongs to the
# workload; compressed anonymous pages are the cheapest way to give some back.
#
# Vendor path, not /etc: ADR-003 makes any Punar-owned /etc file a rollback
# hazard, and zram-generator reads /usr/lib/systemd/zram-generator.conf as a
# first-class location (verified against zram-generator.conf(5) shipped by
# zram-generator 1.2.1-1 — the search set is /etc, /run and /usr/lib).

[zram0]
# A CEILING, NOT AN ALLOCATION. zram consumes physical memory only for pages it
# actually holds, compressed — an unused device of any size costs nothing. So
# sizing at 1:1 with RAM does not halve the machine; it removes an arbitrary
# limit on how much can be reclaimed before the kernel has to start killing
# things. This is the "aggressive" of section 294, and the generator's own
# default (min(ram/2, 4096)) is the conservative posture we are declining.
zram-size = ram

# zstd over lz4: lz4 decompresses faster, zstd compresses far better, and the
# entire purpose here is to hold more in less. On a device chosen for its price
# rather than its clock speed, the scarce resource is memory, not CPU.
compression-algorithm = zstd
