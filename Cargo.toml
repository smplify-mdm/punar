# Punar workspace — crates per SPEC_v0.2.md section 67.
#
# Milestone 0 scope: compiling, tested foundation stubs. Daemon/CLI behavior
# arrives in Milestone 3+ (SPEC section 76); nothing here pretends otherwise.

[workspace]
resolver = "3"
members = [
    "crates/punar-agentd",
    "crates/punar-common",
    "crates/punar-netd",
    "crates/punar-policy",
    "crates/punar-secrets",
    "crates/punar-workspace",
    "crates/punarctl",
    "crates/punard",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# Internal crates
punar-common = { path = "crates/punar-common" }
punar-policy = { path = "crates/punar-policy" }

# External
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
