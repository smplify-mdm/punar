# punar-secrets runtime directory (docs/api/ipc.md section 16.1; M9 —
# docs/development/milestone-9.md §3.1).
#
# /run/punar-secrets is deliberately NOT /run/punar: that M1 dir is 0755
# punar:punar so the unprivileged session can write CI artifacts — a control
# socket in a peer-writable directory could be unlinked and squatted (the
# same argument that put punard's and punar-agentd's sockets in their own
# root-owned runtime directories). The socket itself is created 0660
# root:punar by punar-secrets before listen(); admission is the filesystem
# (root or group punar connects, everyone else gets EACCES — spec section
# 61), and SO_PEERCRED read at accept() plus the peer's cgroup are the
# authorization inputs (spec sections 22, 61).
d /run/punar-secrets 0750 root punar -
# There is NO state directory line here, and that absence is the design:
# the broker holds sha256(token) in memory and nothing else, so it has
# nowhere to write a credential even if it wanted to (SPEC section 29,
# milestone-9.md §6.3). punar-secrets.service's ReadWritePaths= says the
# same thing from the other side.
