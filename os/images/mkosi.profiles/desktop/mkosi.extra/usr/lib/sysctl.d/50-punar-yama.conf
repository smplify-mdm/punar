# Yama: a process may ptrace-attach only to its own descendants (F0-S2;
# PLAN.md section 2.1; docs/design/onboarding.md section 1.6).
#
# WHY. Every person's processes share a uid with every program that person
# runs. Without this, any of them — a compromised app, an agent, a browser
# helper — can attach to any other and read its memory: the shell while a
# password is typed into it, `punarctl` while it holds a ticket, a host that
# holds an unlocked connection. Arch's kernel starts Yama at 1; Debian's
# patches it to 0 (debian/patches/debian/yama-disable-by-default.patch), so
# the value is stated here, on all three lanes, rather than inherited.
#
# WHAT STILL WORKS. Yama restricts PTRACE_MODE_ATTACH checks only (ptrace
# attach, /proc/<pid>/mem, process_vm_readv, pidfd_getfd); it never touches
# PTRACE_MODE_READ, so /proc/<pid>/status, cgroup and cmdline reads by
# punard, punar-agentd and punar-pim-launch are unchanged. A debugger still
# runs its own children (`gdb ./prog`, `strace cmd`). punard's by-pid
# descriptor fetch (pidfd_getfd, crates/punard/src/install.rs
# duplicate_peer_descriptor) still works: punard runs as root with a full
# capability set (punard.service sets no CapabilityBoundingSet), and Yama's
# relational mode lets CAP_SYS_PTRACE in the target's user namespace attach
# to anything (security/yama/yama_lsm.c, yama_ptrace_access_check:
# `!ns_capable(__task_cred(child)->user_ns, CAP_SYS_PTRACE)`). Any later
# trimming of punard's capabilities must keep CAP_SYS_PTRACE.
#
# 1, and not 2 or 3: 3 forbids attach even to root and would break that
# descriptor fetch; 2 would take a developer's `gdb -p` away for nothing this
# threat model needs. Release gate A22 refuses a tree where anything sets a
# different value.
kernel.yama.ptrace_scope = 1
