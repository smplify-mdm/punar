# punar-desktop: Milestone 1 graphical workstation profile.
#
# mkosi v26 profile (mkosi.profiles/desktop/): layered on top of the base
# os/images/mkosi.conf — the punar-dev minimal image stays untouched, this
# profile only ADDS packages and desktop content (milestone-1.md §3).
# ImageId/Hostname for this profile are passed on the mkosi CLI by
# scripts/container-build.sh (--image-id punar-desktop --hostname
# punar-desktop): CLI scalars override all config files, which sidesteps
# profile scalar-merge ambiguity.
#
# Package set: EXACTLY the verified manifest of milestone-1.md §2.1 (all
# present in ALA snapshot 2026/08/20; versions verified 2026-08-24).
# Deliberately NOT shipped (see §2.1 rationale): vulkan-swrast, seatd
# daemon, tuigreet, uwsm, qemu-guest-agent, otf-geist-mono-nerd,
# linux-firmware. Budget discipline per PERFORMANCE_BUDGETS.md: no GNOME/KDE
# stacks, no pulseaudio (pipewire-pulse shim only), nothing decorative.
#
# Desktop config/assets land via two extra-tree layers:
#   - mkosi.extra/ (versioned): greetd session chain, /usr/lib/punar
#     scripts, marker/RAM units, tmpfiles.
#   - mkosi.extra/ (staged, gitignored): Hyprland/foot/fontconfig configs
#     from os/modules/desktop, vendored fonts, punar-shell QML + tokens —
#     copied in by scripts/container-build.sh so the module trees stay the
#     single source of truth (os/images/.gitignore lists the staged paths).
# mkosi.postinst.chroot (this directory) creates the dev user and enables
# greetd + graphical.target.

[Content]
Packages=hyprland
         xdg-desktop-portal-hyprland
         xdg-desktop-portal
         quickshell
         greetd
         foot
         chromium
         git
         neovim
         podman
         crun
         netavark
         aardvark-dns
         pipewire
         pipewire-pulse
         wireplumber
         mesa
         polkit
         hyprpolkitagent
         noto-fonts
         noto-fonts-emoji
         grim
         slurp
         wl-clipboard
         jq
