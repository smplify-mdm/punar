# ────────────────────────────────────────────────────────────────────────────
# PUNAR · HYPRLAND · BINDS — the §13.3 window grammar (M1) plus the M2
# multitasking grammar: groups (§13.2), floating polish, layout presets
# (§13.5), scratchpads (§13.6), and the project overview (§14.2). M2
# chord assignments follow docs/development/milestone-2.md §3 verbatim.
# M7 adds the AI panel on §25's PUNAR+A (milestone-7.md §8), moving the
# assistant scratchpad to PUNAR+SHIFT+A — the one chord reassignment.
# Sourced by hyprland.conf; variables ($mod, $commandCenter, $overview,
# $layoutScript, …) are defined there.
#
# Human-readable reference table: docs/development/keyboard-grammar.md.
# Every bind uses `bindd` (description flag) so `hyprctl binds -j` is
# self-describing — that feed powers the §12.3 discoverability surfaces
# (PUNAR-hold overlay, `?` help) in M2 without a second source of truth.
# Descriptions must not contain commas (hyprlang field separator).
# ────────────────────────────────────────────────────────────────────────────


# ── FOCUS · PUNAR + H/J/K/L ────────────────────────────────────────────────

bindd = $mod, H, Focus left, movefocus, l
bindd = $mod, J, Focus down, movefocus, d
bindd = $mod, K, Focus up, movefocus, u
bindd = $mod, L, Focus right, movefocus, r
# Note: spec §13.3 also sketches PUNAR+L as "layout chooser"; HJKL focus
# wins (same table, and §13.3 allows bindings to evolve). Resolved in M2
# (milestone-2.md §3): the layout chooser is a command-center action and
# PUNAR+comma/period cycle the presets directly — see LAYOUT PRESETS below.

# ── MOVE WINDOW · PUNAR + SHIFT + H/J/K/L ──────────────────────────────────

bindd = $mod SHIFT, H, Move window left, movewindow, l
bindd = $mod SHIFT, J, Move window down, movewindow, d
bindd = $mod SHIFT, K, Move window up, movewindow, u
bindd = $mod SHIFT, L, Move window right, movewindow, r

# ── GROUPS · STACK/TAB GROUPS (spec §13.2 · M2) ────────────────────────────
# A group stacks windows behind one frame with the groupbar as its tab
# strip (styled in punar-look.conf). PUNAR+G makes/dissolves a group on the
# active window; brackets walk the stack; PUNAR+CTRL+HJKL throws the
# active window INTO an adjacent group (same directional vocabulary as
# focus/move). Group locking is a command-center verb, not a chord.

bindd = $mod, G, Toggle window group, togglegroup
bindd = $mod SHIFT, G, Move window out of group, moveoutofgroup
bindd = $mod, bracketleft, Previous window in group, changegroupactive, b
bindd = $mod, bracketright, Next window in group, changegroupactive, f
bindd = $mod CTRL, H, Move window into group left, moveintogroup, l
bindd = $mod CTRL, J, Move window into group below, moveintogroup, d
bindd = $mod CTRL, K, Move window into group above, moveintogroup, u
bindd = $mod CTRL, L, Move window into group right, moveintogroup, r

# ── RESIZE MODE · PUNAR + R ────────────────────────────────────────────────
# A submap: enter, resize with the same HJKL grammar (hold-repeat enabled),
# Escape or Return exits. 40px steps — decisive, keyboard-sized increments.

bindd = $mod, R, Enter resize mode, submap, resize

submap = resize
bindde = , H, Resize narrower, resizeactive, -40 0
bindde = , J, Resize taller, resizeactive, 0 40
bindde = , K, Resize shorter, resizeactive, 0 -40
bindde = , L, Resize wider, resizeactive, 40 0
bindd = , escape, Exit resize mode, submap, reset
bindd = , Return, Exit resize mode, submap, reset
submap = reset

# ── MODES · FULLSCREEN AND FLOATING (spec §13.2) ───────────────────────────
# M2 floating polish: pin keeps a floating window on every workspace
# (floating-only by design); centerwindow re-centers a float (0.56.2 takes
# NO argument — verified milestone-2.md §1.2). The resize submap above
# already drives floats (resizeactive applies to floats and tiles).

bindd = $mod, F, Toggle fullscreen, fullscreen, 0
bindd = $mod, V, Toggle floating, togglefloating
bindd = $mod SHIFT, V, Pin floating window, pin
bindd = $mod, C, Center floating window, centerwindow

# ── LAYOUT PRESETS · PUNAR + COMMA / PERIOD (spec §13.5 · M2) ──────────────
# Cycle: balanced → columns → rows → focus → stack (wraps; grid is not
# shipped — no native grid algorithm in 0.56.2). comma/period read as < >.
# The full chooser by name is a command-center action; both paths exec the
# same $layoutScript (one source of truth, one hyprctl --batch per call —
# milestone-2.md §4). Presets are global in M2.

bindd = $mod, comma, Previous layout preset, exec, $layoutScript prev
bindd = $mod, period, Next layout preset, exec, $layoutScript next

# ── WORKSPACES · PUNAR + 1..9 ──────────────────────────────────────────────

bindd = $mod, 1, Workspace 1, workspace, 1
bindd = $mod, 2, Workspace 2, workspace, 2
bindd = $mod, 3, Workspace 3, workspace, 3
bindd = $mod, 4, Workspace 4, workspace, 4
bindd = $mod, 5, Workspace 5, workspace, 5
bindd = $mod, 6, Workspace 6, workspace, 6
bindd = $mod, 7, Workspace 7, workspace, 7
bindd = $mod, 8, Workspace 8, workspace, 8
bindd = $mod, 9, Workspace 9, workspace, 9

bindd = $mod SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = $mod SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = $mod SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = $mod SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = $mod SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = $mod SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = $mod SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = $mod SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = $mod SHIFT, 9, Move window to workspace 9, movetoworkspace, 9

# ── PROJECT OVERVIEW · PUNAR + TAB (spec §14.2 · M2) ───────────────────────
# The graphical project overview (Plate D-007), served by punar-shell via
# the $overview IPC variable (hyprland.conf) — this replaces the M1
# workspace-cycle placeholder. Inside the overview the shell owns the
# keys (arrows, type-to-search, Enter, Escape). PUNAR+SHIFT+TAB keeps the
# quick previous-workspace cycle (existing workspaces only).

bindd = $mod, Tab, Project overview, exec, $overview
bindd = $mod SHIFT, Tab, Previous workspace, workspace, e-1

# ── COMMAND CENTER · PUNAR + SPACE ─────────────────────────────────────────
# The universal command center (spec §12.2), served by punar-shell.
# The IPC contract lives in the single $commandCenter variable.

bindd = $mod, Space, Open command center, exec, $commandCenter

# ── WINDOWS AND APPS ───────────────────────────────────────────────────────

bindd = $mod, Q, Close window, killactive
# Opens the guarded action surface. Force quit itself deliberately has no
# direct bind: the user must confirm it against the snapshotted window.
bindd = $mod SHIFT, Q, Window actions, exec, $shell ipc call windowactions toggle
bindd = $mod, Return, Open terminal, exec, $terminal || $terminalFallback
bindd = $mod, B, Open browser, exec, $browser

# ── AI PANEL · PUNAR + A (spec §25 · M7) ───────────────────────────────────
# "AI on this device" — the local AI surface (Plate D-005), served by
# punar-shell via the $aiPanel IPC variable (hyprland.conf). Inside the
# panel the shell owns the keys (↑/↓ walk the agent rail, Escape closes).
#
# PUNAR+A is spec §25's own shortcut, so M7 takes it back from the M2
# assistant scratchpad, which moves to PUNAR+SHIFT+A below. Nothing is
# lost: the assistant pad is an empty special workspace with no
# pre-spawned client (milestone-2.md §2), while the AI panel is the
# milestone's headline surface. Two binds on one chord is not an option —
# Hyprland would fire both.

bindd = $mod, A, AI on this device, exec, $aiPanel

# PRIVACY PANEL · PUNAR + P (M12 · Plate D-006)
# Local, on-demand TCP activity and policy-denial visibility. The surface
# marks packet-relay simulation and future DNS protection explicitly rather
# than presenting either as active security.

bindd = $mod, P, Privacy and network activity, exec, $shell ipc call privacypanel toggle

# ── SCRATCHPADS · PUNAR + T / SHIFT+A / N (spec §13.6 · M2) ────────────────
# Three scratchpads on three special workspaces: the terminal on special:term
# is demand-started by one fixed helper; the warm foot server keeps its cold
# path short without retaining a hidden window in every session. The
# M2 assistant and notes pads (special:assistant / special:notes,
# milestone-2.md §2 — nothing pre-spawned; the shell/command center
# launches their clients, which the app-id rules below then park). If a
# scratchpad's window is closed its special workspace closes with it
# (misc:close_special_on_empty default); relaunch via PUNAR+Space or
# `foot --app-id=punar-scratch`.

bindd = $mod, T, Toggle scratchpad terminal, exec, $scratchpadScript
bindd = $mod SHIFT, A, Toggle assistant scratchpad, togglespecialworkspace, assistant
bindd = $mod, N, Toggle notes scratchpad, togglespecialworkspace, notes

# Every scratchpad presents as the same centered card: 60% × 60% of the
# monitor (Plate D-007's justified float), floating, parked silently on
# its special workspace at spawn so launching never raises it. (0.56
# windowrule field grammar; size takes expressions — percent units don't
# exist there.)
windowrule = match:class ^($scratchClass)$, workspace special:term silent, float on, size monitor_w*0.6 monitor_h*0.6, center on
windowrule = match:class ^($assistantClass)$, workspace special:assistant silent, float on, size monitor_w*0.6 monitor_h*0.6, center on
windowrule = match:class ^($notesClass)$, workspace special:notes silent, float on, size monitor_w*0.6 monitor_h*0.6, center on

# ── FLOAT RULES · DIALOGS AND PORTALS (spec §13.2 · M2) ────────────────────
# Dialog-shaped surfaces never tile: portal implementations (file chooser
# and friends) and the common file-dialog titles float as centered cards.
# Title matches are exact-anchored to stay conservative — a browser tab
# merely named "Open File" contains more than the bare title. (Regexes
# must not contain commas — hyprlang field separator.)
windowrule = match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-gnome|org.freedesktop.impl.portal.desktop.kde)$, float on, center on
windowrule = match:title ^(Open File|Open Files|Open Folder|Save File|Save As|File Upload)$, float on, center on

# ── MULTI-MONITOR · PUNAR + SHIFT + ARROWS (spec §15) ──────────────────────
# Explicit cross-display moves; HJKL focus/move also spill over edges via
# binds:window_direction_monitor_fallback (hyprland.conf).

bindd = $mod SHIFT, left, Move window to left monitor, movewindow, mon:l
bindd = $mod SHIFT, right, Move window to right monitor, movewindow, mon:r
bindd = $mod SHIFT, up, Move window to upper monitor, movewindow, mon:u
bindd = $mod SHIFT, down, Move window to lower monitor, movewindow, mon:d

# ── SCREENSHOTS (spec §12.1) ───────────────────────────────────────────────
# Keyboard path: Print copies the full output to the clipboard. The region
# variant needs the pointer for slurp — documented as pointer-assisted.

bindd = , Print, Screenshot output to clipboard, exec, grim - | wl-copy --type image/png
bindd = $mod SHIFT, S, Screenshot region to clipboard, exec, grim -g "$(slurp)" - | wl-copy --type image/png

# ── NOTIFICATION CENTRE · PUNAR + SHIFT + N (spec §12.1 · Plate D-009) ─────
# The notification centre (docs/design/mockups/notifications-osd.html
# Sect II), served by punar-shell over the $shell IPC variable defined in
# hyprland.conf. Inside the centre the shell owns the keys: j/k walk the
# list, x dismisses, Enter opens what the row points at, C clears, D
# toggles do-not-disturb, Escape closes.
#
# WHY SHIFT, WHEN THE PLATE PRINTS `PUNAR + N`. PUNAR+N is already bound,
# to the M2 notes scratchpad (see SCRATCHPADS above), and two binds on one
# chord is not an option — Hyprland fires both. milestone-13.md §10.5
# recorded exactly this collision and declined to resolve it because M13
# declined the notification centre; the centre now exists, so the collision
# is real. This pass takes the free neighbouring chord rather than silently
# unbinding somebody else's surface. The M7 precedent (PUNAR+A taken back
# from the assistant scratchpad, which moved to PUNAR+SHIFT+A) is the way
# to give the centre the plate's own chord, and it is a one-line change to
# the scratchpad bind above — a deliberate reassignment for whoever owns
# that decision, not a side effect of adding a surface.

bindd = $mod SHIFT, N, Notification centre, exec, $shell ipc call notifications toggle

# ── VOLUME · MEDIA KEYS (Plate D-009 Sect III) ─────────────────────────────
# The keys that drive the segmented-tick OSD. 5% steps, matching the OSD's
# twenty ticks exactly, so every press moves the meter by precisely one
# tick and the reading is never between two states.
#
# The OSD is NOT driven by these binds. It reads the pipewire sink and
# raises on the sink's own change event — so it draws the value the sink
# actually settled on, whoever moved it (a key, a mixer, an application),
# and it cannot show a level the machine does not hold. `wpctl` is
# wireplumber's own CLI and ships in the desktop image; there is no typed
# `system.volume` capability yet, and the shell does not pretend otherwise.
#
# `-l 1.0` caps the sink at 100%, so the meter can never be asked to draw a
# twenty-first tick. Repeat (`bindde`) is on for the level keys and off for
# mute, which is a toggle.
#
# No brightness keys are bound: Punar ships no backlight capability and the
# VM target has no physical backlight, so a brightness key would be a
# control that does nothing (spec 1.22). The OSD's brightness row exists,
# renders dashed with its SIM · VM tag, and is reachable only by an
# explicit IPC call until a real capability ships.

bindde = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindde = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindd = , XF86AudioMute, Toggle mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# ── SESSION ────────────────────────────────────────────────────────────────
# Ends the Hyprland session; greetd falls back to its default_session
# (agreety) per milestone-1.md §4.

bindd = $mod SHIFT, E, End session, exit

# ── SHORTCUT HELP · PUNAR + / (spec §12.3 · Plate D-017) ───────────────────
# The §12.3 discoverability surface, served by punar-shell: `shortcuts`
# IpcHandler target (toggle/open/close/state/reload/rows/undescribed; the
# bind uses toggle). It is generated from `hyprctl binds -j` — the live
# table this file produces — so the help surface cannot drift from the
# machine it describes, and this very line arrives in the help surface
# through the same transform as everything else, with no special case.
#
# `?` is deliberately NOT a global bind: a bare question mark cannot be
# one without eating the character out of every text field. The shell
# surfaces that already own the keyboard open the help on `?` themselves.
#
# No new variable: $shell (hyprland.conf) is the shell runtime prefix that
# every `qs ipc call` client needs, and the contract string is one field.
bindd = $mod, slash, Shortcut help, exec, $shell ipc call shortcuts toggle

# ── STATUS CLUSTER · PUNAR + SHIFT + B (Plate D-016) ───────────────────────
# Focuses the bar's live status cluster: focus lands on the leftmost slot
# unless something is warn or bad, in which case it lands on the
# highest-severity slot; ← → (and H L) walk the visible slots without
# wrapping, ↵ opens the surface that owns the slot, Esc releases focus
# back to the window that had it. On a calm bar there is nothing to focus
# and the call answers `empty` without taking the keyboard.
#
# DEVIATION FROM THE PLATE, STATED: D-016 Sect III·01 writes PUNAR+B.
# PUNAR+B has opened the browser since M1 (see WINDOWS AND APPS above) and
# two binds on one chord is not an option — Hyprland fires both. Taking a
# working chord away from the user to satisfy a plate written without the
# config in hand is the worse trade, so the cluster takes PUNAR+SHIFT+B
# and keeps the B-for-bar mnemonic. The help surface prints whichever
# chord this file actually carries, so the deviation cannot become a lie.
bindd = $mod SHIFT, B, Focus status cluster, exec, $shell ipc call bar focus

# ── SYSTEM CONTROL · PUNAR + S (spec §63 · Plate D-004) ────────────────────
# The full-surface settings panel, served by punar-shell: `systemcontrol`
# IpcHandler target (toggle/open/close/state; the bind uses toggle). Inside
# the panel the shell owns the keys — ↑↓ walk the §63 taxonomy rail, `/`
# searches it, PgUp/PgDn scroll the detail pane, the letter keys the pane
# prints fire that view's actions, and Escape closes.
#
# PUNAR+S is spec §63's own suggested chord and is free: the only other S
# bind is PUNAR+SHIFT+S (screenshot region, above), a different chord.
#
# No new variable: $shell (hyprland.conf) is the shell runtime prefix every
# `qs ipc call` client already uses, and the contract string is one field.
bindd = $mod, S, System control, exec, $shell ipc call systemcontrol toggle

# ── LOCK SESSION · PUNAR + ESCAPE (Plate D-002 / D-012 Sect III) ───────────
# The real session lock, served by punar-shell: `lock` IpcHandler target,
# which exposes `lock` and `state` and DELIBERATELY NO `unlock` — an IPC
# unlock verb would make the session socket a complete bypass of the
# passphrase. It drives ext-session-lock-v1 through Quickshell's
# WlSessionLock and authenticates through a real PAM conversation; the
# shell never reads a hash and never compares a string.
#
# WHY NOT PUNAR+L, THE CHORD EVERY OTHER DESKTOP USES. All three L chords
# are already load-bearing in the §13.3 directional grammar: PUNAR+L is
# focus-right, PUNAR+SHIFT+L moves the window right, PUNAR+CTRL+L throws it
# into the group on the right. keyboard-grammar.md §"PUNAR+L collision
# resolution" already settled the first of those in favour of directional
# focus, and two binds on one chord is not an option — Hyprland fires both.
# Taking a working directional key away from every window operation to give
# the lock a familiar chord is the worse trade.
#
# PUNAR+ESCAPE is free at the top level (the only `escape` bind in this
# file lives inside the `resize` submap, a different scope) and it carries
# its own meaning in this grammar: Escape is the key that leaves. The help
# surface (PUNAR+/) prints whichever chord this file actually carries, so
# the choice is discoverable rather than remembered.
#
# The contract goes through the $lock variable in hyprland.conf, the same
# ONE-variable mechanism $commandCenter/$overview/$aiPanel use.
bindd = $mod, escape, Lock session, exec, $lock
