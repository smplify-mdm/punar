# Initrd only. If PID 1 crashes, or ends up where it would freeze (a failed
# switch_root() re-executing it in an initramfs that
# punar-release-initramfs.service has emptied, or a shutdown binary it cannot
# execute), it reboots after 10 s instead, so boot counting can fall back to
# the other slot with no one at the machine. The booted system reads its own
# configuration after switch-root; this does not reach it.
[Manager]
CrashAction=reboot
