# Punar Debian/amd64 substrate candidate.
#
# This lane intentionally coexists with the shipping Arch/x86_64 image until
# the same boot, desktop, installer and performance gates pass. It proves the
# common ADR-005 substrate without silently replacing a working baseline.

[Distribution]
Distribution=debian
Release=unstable
Architecture=x86-64

[Output]
Format=disk
OutputDirectory=../out
SplitArtifacts=
Seed=46b206c3-e628-4131-9339-28bb2a86d10f

[Build]
CacheDirectory=../cache/debian-amd64
BuildSources=..

[Content]
ExtraTrees=../debian-mkosi.extra
Packages=systemd
         systemd-sysv
         systemd-repart
         systemd-boot
         systemd-boot-efi
         systemd-boot-tools
         linux-image-amd64
         mount
RemoveFiles=/var/cache/ldconfig/aux-cache
            /var/log/*
Bootable=yes
Bootloader=systemd-boot

# Keep the complete Debian hardware profile in the installed root, but put
# only mkosi's architecture-aware boot set in the UKI. With this explicit
# selector, installing broad Intel/AMD/Wi-Fi/audio firmware does not make
# mkosi resolve every kernel module and pin its firmware in early-boot RAM.
KernelInitrdModules=default

# mkosi 26's Debian initrd expects mount(8), which Debian packages separately
# from util-linux. This is the same adapter proven by the ARM64 lane.
InitrdPackages=mount

# QUIET IS A PRODUCT DECISION, not a preference. VT1 is the console AND the
# virtual terminal greetd hands the compositors back and forth across, so
# everything printed at boot is still sitting there when the greeter exits and
# the desktop's compositor has not yet drawn. The owner saw it: a wall of boot
# text between signing in and the desktop appearing. `quiet loglevel=3` stops
# the kernel filling that terminal, and it also puts systemd into
# show-status=no; `vt.global_cursor_default=0` removes the blinking cursor that
# would otherwise be the one thing left on an empty screen.
#
# DIAGNOSTICS ARE NOT LOST. The journal is untouched and complete, and the dev
# profile replaces this line wholesale (it adds console=ttyS0, which release
# assertion A8 forbids here), so every CI boot marker still reaches the serial
# log exactly as before. Units that write to the console with
# StandardOutput=journal+console are also unaffected: loglevel gates the kernel
# ring buffer, not writes to /dev/console.
KernelCommandLine=console=tty0 quiet loglevel=3 vt.global_cursor_default=0 systemd.getty_auto=no root=PARTUUID=1beabfe0-9cb8-4b49-91ef-d372b845e7ea rw
FinalizeScripts=../mkosi.finalize
Locale=C.UTF-8
Timezone=UTC
