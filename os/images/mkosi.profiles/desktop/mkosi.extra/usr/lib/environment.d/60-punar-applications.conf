# Punar's root-owned, mutable application handler defaults live outside the
# immutable A/B root slots.  Declare the path to the systemd user manager at
# manager startup so D-Bus-activated portals cannot race the graphical
# session's later environment import.  Later administrator or user files may
# place additional search roots ahead of this fallback; per-user mimeapps.list
# remains the highest-precedence handler choice.
XDG_CONFIG_DIRS=/etc/xdg:/var/lib/punar-applications/config
