# Debian/amd64 live-installer boot-artifact adapter. Keep this content aligned
# with the shared x86 installer profile: the Debian package and hardware
# profiles are composed beside it by container-build.sh.

[Output]
ImageId=punar-installer-root-debian-x86_64

[Content]
KernelCommandLine=
KernelCommandLine=console=tty0 rd.systemd.gpt_auto=0 systemd.getty_auto=no punar.live=1
KernelInitrdModules=default
                       loop
                       overlay
                       erofs
                       isofs
                       sr_mod
                       virtio_blk
                       virtio_pci
                       ahci
                       nvme
