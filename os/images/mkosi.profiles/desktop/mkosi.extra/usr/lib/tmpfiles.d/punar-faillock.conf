# The account-lockout tally directory, because one substrate ships it and the
# other does not.
#
# /etc/security/faillock.conf sets deny=5 with a 300 s unlock window, and
# check-release-image.sh asserts that policy is present. On the Debian lanes it
# was recording NOTHING: pam_faillock's compiled default tally directory is
# /var/run/faillock, Debian's libpam-modules ships no tmpfiles snippet creating
# it, and the directory therefore did not exist. Measured on a running Debian
# ARM64 machine — `ls -ld /run/faillock` failed, and the journal carried
# "pam_faillock(punar-lock:auth): Error opening the tally file". Arch's
# pam-1.7.2-2 ships usr/lib/tmpfiles.d/pam.conf with exactly the line below, so
# the same policy counted correctly there and the gap was invisible on that lane.
#
# A documented, asserted lockout policy that silently counts nothing is worse
# than no policy, because the assertion reads as coverage. This makes the
# directory a property of Punar rather than of whichever substrate is
# underneath, and the mode matches Arch's so neither lane is special.
#
# THIS FILE ALONE DOES NOT MAKE THE LOCKOUT WORK, and saying so here matters
# because the mode looks like it should. 0755 root:root means an UNPRIVILEGED
# pam_faillock cannot create a tally file in it, and pam_faillock's write path
# swallows EACCES without a log line — so on its own this change trades a
# visible ENOENT for a silent EACCES, which is worse for anyone diagnosing it.
# It becomes a real fix only alongside punar-authd, which runs the punar-lock
# stack as root and can therefore write here. The same reasoning says Arch's
# lockout was never reliable either, for the same permission reason rather than
# a missing directory.
#
# /run rather than /var is deliberate and is upstream's choice too: a tally that
# survives a reboot would turn a burst of failed attempts into a lockout the
# owner cannot clear by restarting, and unlock_time already bounds the window.
d /run/faillock 0755 root root -
