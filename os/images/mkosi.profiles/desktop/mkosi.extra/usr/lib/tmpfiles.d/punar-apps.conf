# Verified on-demand application payloads and their freedesktop entries.
# Payloads are public vendor binaries, not Punar state or user data, so the
# session may read/execute them. Only root/punard can add or replace content.
d /var/lib/punar-apps         0755 root root -
d /var/lib/punar-applications 0755 root root -
d /var/lib/punar-applications/applications 0755 root root -
d /var/lib/punar-applications/config       0755 root root -

# THE FLATPAK EXPORT DIRECTORY HAS TO EXIST BEFORE THE SHELL STARTS, and the
# reason is a single line of Quickshell rather than anything about flatpak.
#
# quickshell 0.3.0 src/core/desktopentrymonitor.cpp:46 —
#
#     void DesktopEntryMonitor::startMonitoring() {
#         for (const auto& path: DesktopEntryManager::desktopPaths()) {
#             if (!QDir(path).exists()) continue;
#             addPathAndParents(this->watcher, path);
#             this->scanAndWatch(path);
#         }
#     }
#
# startMonitoring() is private and runs exactly ONCE, from the constructor. A
# datadir that does not exist at that moment is skipped whole — the `continue`
# also skips addPathAndParents, so not even its parents are watched — and
# nothing ever re-arms it: handleFileChanges() rescans but never re-monitors,
# there is no polling, and no QML hook forces a rescan. Byte-identical in
# 0.3.0, 0.3.1 and current master, so this is not waiting on an upgrade.
#
# On a fresh device /var/lib/flatpak does not exist at boot. mkosi.postinst runs
# `flatpak remote-add --system` at BUILD time into the root slot, and PUNAR-DATA's
# @var subvolume is then mounted over /var and shadows it — the same fact that
# left every catalogue install with no remote. So the shell started, skipped the
# path, and never looked again: the first app a person installed was invisible
# to the freedesktop index for the rest of the session. The bar printed its raw
# id (ORG.GNOME.EVOLUTION), and the icon and command-centre search missed it too,
# because all three read that one model.
#
# Creating the directory empty is enough. The scanner re-checks isDir() on every
# run, so the missing trigger was the whole defect: once the path exists at
# startup it is watched, and flatpak writing a .desktop into it fires
# directoryChanged and the rescan picks the app up while the person watches.
d /var/lib/flatpak                             0755 root root -
d /var/lib/flatpak/exports                     0755 root root -
d /var/lib/flatpak/exports/share               0755 root root -
d /var/lib/flatpak/exports/share/applications  0755 root root -
