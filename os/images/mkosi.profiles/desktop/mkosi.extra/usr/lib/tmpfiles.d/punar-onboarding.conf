# Persistent identity authority lives on shared /var; boot-local projections,
# the admitted first-run socket and one-use first-session token live on tmpfs.
d /var/lib/punar/identity    0700 root root    -
d /var/lib/punar/onboarding  0700 root root    -
d /run/userdb                0755 root root    -
d /run/punar-onboardd        0750 root greeter -
d /run/punar-first-login     0700 root root    -
