# punar-agentd directories (docs/api/ipc.md section 10.1; M7 —
# docs/development/milestone-7.md §3).
#
# /run/punar-agentd is deliberately NOT /run/punar: that M1 dir is 0755
# punar:punar so the unprivileged session can write CI artifacts — a control
# socket in a peer-writable directory could be unlinked and squatted (the
# same argument that put punard's socket in /run/punard). The socket itself
# is created 0660 root:punar by punar-agentd before listen(); admission is
# the filesystem (root or group punar connects, everyone else gets EACCES),
# and SO_PEERCRED read at accept is the authorization input (spec 61).
d /run/punar-agentd     0750 root punar -
# Registry state: the append-only registry.jsonl lives here, 0640 root:root.
# Root-only — a writable registry IS attribution authority (spec 22): a peer
# who can rewrite the transition log can claim any session belonged to
# anyone. /var/lib/punar itself is created 0700 root root by punard.conf.
d /var/lib/punar/agents 0700 root root  -
