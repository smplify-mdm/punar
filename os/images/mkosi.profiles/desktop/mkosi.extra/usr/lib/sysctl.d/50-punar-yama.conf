# Yama: a process may ptrace-attach only to its own descendants (F0-S2;
# PLAN.md section 2.1; docs/design/onboarding.md section 1.6).
#
# WHY. Every person's processes share a uid with every program that person
# runs. Without this, any of them — a compromised app, an agent, a browser
# helper — can attach to any other and read its memory: the shell while a
# password is typed into it, `punarctl` while it holds a ticket, a host that
# holds an unlocked connection. Arch's kernel starts Yama at 1; Debian's
# patches it to 0 (debian/patches/debian/yama-disable-by-default.patch), so
# the value is stated here, on all three lanes, rather than inherited.
#
# WHAT STILL WORKS. Yama restricts PTRACE_MODE_ATTACH checks only (ptrace
# attach, /proc/<pid>/mem, process_vm_readv, pidfd_getfd); it never touches
# PTRACE_MODE_READ, so /proc/<pid>/status, cgroup and cmdline reads by
# punard, punar-agentd and punar-pim-launch are unchanged. punard's by-pid
# descriptor fetch (pidfd_getfd, crates/punard/src/install.rs
# duplicate_peer_descriptor) still works: punard runs as root with a full
# capability set (punard.service sets no CapabilityBoundingSet), and Yama's
# relational mode lets CAP_SYS_PTRACE in the target's user namespace attach
# to anything (security/yama/yama_lsm.c, yama_ptrace_access_check:
# `!ns_capable(__task_cred(child)->user_ns, CAP_SYS_PTRACE)`). Any later
# trimming of punard's capabilities must keep CAP_SYS_PTRACE.
#
# WHAT STOPS WORKING, and the supported way instead (F0 review). At 1, a
# debugger may attach only to a process it started (or one that named it):
# `gdb -p <pid>`, `strace -p <pid>`, `perf trace -p` and `py-spy dump --pid`
# against a program of your own that is already running fail with EPERM,
# exactly as they would against another person's. There is no sudo route on a
# Punar device, so there is no "attach as root" either. The supported ways:
#   * start the program under the tool: `gdb --args ./prog`, `strace ./prog`,
#     `py-spy record -- python app.py`;
#   * or let the program choose its debugger: prctl(PR_SET_PTRACER, pid) —
#     or PR_SET_PTRACER_ANY for a development build — opts that one process
#     in, and nothing else.
# Raising the scope for a debugging session is not offered: it is a device-
# wide setting, so lowering it would expose every person's shell and
# password holders at once, and no F0 method exists to do it with a fresh
# administrator password and an audit event. It is a decision for its own
# change, not an ad-hoc sysctl.
#
# A CRASH DUMP IS THE OTHER WAY TO READ A PROCESS'S MEMORY, and Yama does not
# cover it: `kill -SEGV` a process of your own, then read the core that
# systemd-coredump keeps for you. So every holder of a secret refuses to dump:
# punarctl, punar-auth and every other punar-reauth caller set PR_SET_DUMPABLE
# 0 and RLIMIT_CORE 0 (punar_reauth::harden), and the desktop shell — which
# holds a password as a string while a person types it — runs with RLIMIT_CORE
# 0, soft and hard, under /usr/lib/punar/punar-shell-run.
#
# 1, and not 2 or 3: 3 forbids attach even to root and would break that
# descriptor fetch; 2 allows attach only with CAP_SYS_PTRACE, which would take
# away even debugging a program a person starts under the debugger, for
# nothing this threat model needs. Release gate A22 refuses a tree where
# anything sets a different value.
kernel.yama.ptrace_scope = 1
