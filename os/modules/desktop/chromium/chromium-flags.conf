# Punar Chromium defaults — installed system-wide as /etc/chromium-flags.conf.
#
# MECHANISM (verified 2026-08-26 against chromium 151.0.7922.173-1 from the
# pinned ALA snapshot, by reading the strings of the compiled /usr/bin/chromium
# launcher rather than trusting documentation):
#
#   "Custom flags are read in order from the following files:
#      /etc/chromium-flags.conf
#      $XDG_CONFIG_HOME/chromium-flags.conf   (default ~/.config/...)
#    Arguments included in those files are split on whitespace and shell
#    quoting rules apply but no further parsing is performed. Lines starting
#    with a hash symbol (#) are skipped. Lines with unbalanced quotes are
#    skipped as well."
#
# Two consequences that shape this file:
#
#  1. BOTH files are read, in order — a user's ~/.config/chromium-flags.conf
#     ADDS to these defaults rather than replacing them. This is the OPPOSITE
#     of foot.ini's first-found-wins rule (see foot/foot.ini and the module
#     README), so a user overriding one flag here does not silently lose the
#     rest. Punar's defaults are therefore a floor, not a cage.
#  2. A line with unbalanced quotes is skipped SILENTLY — no warning, no
#     error, the flag simply never applies. Every line here is unquoted for
#     that reason, and surfaces-check.sh asserts the effect of the flags on a
#     running browser rather than the presence of this text.
#
# WHY FLAGS AND NOT ENTERPRISE POLICY. Chromium also reads managed policy from
# /etc/chromium/policies/managed/. Punar deliberately does NOT write there on
# an unmanaged device: a managed policy makes chrome://policy report the device
# as managed and puts "Managed by your organization" in the browser's own menu.
# On a device that was never enrolled that statement is FALSE, and it is the
# same class of defect as the M5 policy.d/ai directory that was created on
# every device including unenrolled ones — an unmanaged-first violation at the
# data-model level (DESIGN_LANGUAGE.md section 8: enrollment adds chrome, it
# never restructures a surface). When a device IS enrolled, managed policy is
# the correct mechanism and Milestone 11 introduces it as an additive layer.

# Native Wayland rather than XWayland.
#
# This flag is the reason the file exists. It used to live on the SUPER+B
# keybind alone, which meant it applied to exactly ONE of the several ways a
# browser gets launched: the bind got a native Wayland browser, while the
# application launcher, xdg-open (every link opened from another app), and any
# future web-app launcher went through the packaged chromium.desktop and got
# XWayland — blurry on fractional scaling, wrong cursor size, no native
# fractional-scale or per-monitor DPI. Moving it here makes every launch path
# identical, which is the invariant surfaces-check.sh asserts by launching the
# browser and reading back hyprctl's per-client xwayland flag.
--ozone-platform-hint=auto

# Punar has already introduced itself. The first-run flow is Chromium's own
# welcome/sign-in sequence, which asks a user who just completed Punar's
# onboarding to complete a second, unrelated onboarding for a Google account.
--no-first-run

# Punar names the default handler declaratively in the mimeapps.list shipped
# beside this file, so the browser's own "make me the default" prompt can only
# disagree with a system that already decided. It is noise on every start.
#
# (This comment originally claimed xdg-mime set the default. It did not: at the
#  time it was written NOTHING in the tree registered a handler, so xdg-open on
#  an http(s) URL had nothing to open. The claim was checked before it shipped,
#  found false, and the missing handler written rather than the sentence.)
--no-default-browser-check
