# punar-agentd directories (docs/api/ipc.md section 10.1; M7 —
# docs/development/milestone-7.md §3).
#
# /run/punar-agentd is deliberately NOT /run/punar: that summary directory is
# 0755 root:root and world-traversable, while a control socket must live behind
# a group-traversable boundary (the same argument that put punard's socket in
# /run/punard). The socket itself
# is created 0660 root:punar by punar-agentd before listen(); admission is
# the filesystem (root or group punar connects, everyone else gets EACCES),
# and SO_PEERCRED read at accept is the authorization input (spec 61).
d /run/punar-agentd     0750 root punar -
# Registry state: the append-only registry.jsonl lives here, 0640 root:root.
# Root-only — a writable registry IS attribution authority (spec 22): a peer
# who can rewrite the transition log can claim any session belonged to
# anyone. /var/lib/punar itself is created 0700 root root by punard.conf.
d /var/lib/punar/agents 0700 root root  -
# M8 AI Access Ledger state (docs/development/milestone-8.md §5.2,
# docs/api/ipc.md §13). Per-session aggregates plus index.json live here,
# 0640 root:root inside a 0700 root:root directory. Root-only for the same
# reason the registry is: a ledger a peer can rewrite is not evidence of
# anything. It is also PERSONAL DATA — the reason `agents.access` is owner-
# or-root rather than open to any admitted peer like `agents.list`, and the
# reason the shell's copy at /run/punar-agentd/ledger.json is 0640
# root:punar inside this daemon's root-owned runtime directory instead of
# world-readable in /run/punar (spec sections 21.2, 24).
#
# punar-agentd creates this directory itself at startup, so a missing line
# here degrades nothing — the line exists so the mode is declared in the
# image, where an auditor can read it, rather than only in a Rust constant.
d /var/lib/punar/agents/ledger 0700 root root -
