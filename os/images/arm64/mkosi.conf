# Punar native ARM64 migration image.
#
# This is a deliberately minimal, boot-gated lane. It proves one reproducible
# Debian snapshot can produce a native aarch64 UEFI image before the complete
# desktop profile moves off the x86_64-only Arch substrate. It is not a
# Raspberry Pi image: QEMU's SBSA-style `virt` machine and the Pi firmware boot
# chain are different platforms, and ADR-006 owns the latter.

[Distribution]
Distribution=debian
Release=unstable
Architecture=arm64

[Output]
Format=disk
OutputDirectory=../out
# The migration artifact is the bootable disk. UKI/kernel/initrd copies remain
# available inside it and only duplicate hundreds of MiB beside the qcow2.
SplitArtifacts=
Seed=46b206c3-e628-4131-9339-28bb2a86d10f

[Build]
CacheDirectory=../cache/debian-arm64
# Finalize scripts execute in mkosi's sandbox. Expose the shared image
# directory containing the policy checker and architecture manifests.
BuildSources=..

[Content]
ExtraTrees=../debian-mkosi.extra
# systemd-sysv supplies /sbin/init on Debian. Debian's systemd-boot package is
# the integration layer: it depends on the native AA64 bootloader/tools and
# supplies systemd-bless-boot plus its generator. Without that package the
# firmware decrements a pending entry but a healthy system can never bless it.
# linux-image-arm64 selects Debian's signed arm64 kernel metapackage from the
# pinned snapshot.
Packages=systemd
         systemd-sysv
         systemd-repart
         systemd-boot
         systemd-boot-efi
         systemd-boot-tools
         linux-image-arm64
         mount
RemoveFiles=/var/cache/ldconfig/aux-cache
            /var/log/*
Bootable=yes
Bootloader=systemd-boot

# mkosi's default set includes the generic storage/virtio modules plus its
# ARM64 MMC/USB additions. Keep the remainder in the installed root rather
# than pinning the full kernel-module tree in the unified kernel image.
KernelInitrdModules=default

# mkosi 26's built-in Debian initrd names util-linux but Debian split mount(8)
# into its own package. Without this explicit initrd package, firmware reaches
# the UKI but the initrd cannot mount the real root. This is an upstream
# compatibility adapter, not a target-image convenience dependency.
InitrdPackages=mount

# Same slot-selection contract as x86_64: the UKI and selected root cannot
# drift because the literal root-A PARTUUID lives inside the UKI itself.
KernelCommandLine=console=tty0 systemd.getty_auto=no root=PARTUUID=1beabfe0-9cb8-4b49-91ef-d372b845e7ea rw

# The shared finalize assertion is auto-discovered by x86_64 from its image
# root; ARM's config is one directory deeper, so name it explicitly here.
FinalizeScripts=../mkosi.finalize
Locale=C.UTF-8
Timezone=UTC
