[package]
name = "punarctl"
description = "Punar control CLI (SPEC section 11.2) — talks the docs/api/ipc.md typed IPC contract to punard; output per Plate D-014"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clap = { workspace = true }
punar-common = { workspace = true }
# rustix (M9, docs/development/milestone-9.md section 4.3): inotify +
# poll behind `punarctl approvals wait`. Waiting is a client concern —
# the daemon answers `approval_required` immediately and must not park a
# connection for the life of an approval — so the CLI watches for the
# wake and asks the socket for the truth. Already in the workspace tree
# for punard's SO_PEERCRED and punar-common's flock; `event` adds poll for
# approval waits and `process` lets the VM-only installer gate verify uid 0.
# None of these kernel interfaces is reachable from safe std, and workspace
# crates are #![forbid(unsafe_code)].
rustix = { workspace = true, features = ["event", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
