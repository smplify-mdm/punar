# Dev/CI image only (release check A5 refuses this file): point punard at the
# mock control plane instead of the built-in Smplify agent, so the M5/M10/M11
# exercises keep their fixture organisation as the oracle. punard reads the
# variable at its own start (crates/punard/src/main.rs), which is why this is
# a unit drop-in and not something a check script could export.
[Service]
Environment=PUNAR_CONTROL_PLANE_SOCKET=/run/punar-mock-smplify/api.sock
