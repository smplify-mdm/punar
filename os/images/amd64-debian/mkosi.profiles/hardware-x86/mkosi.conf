# Debian/amd64 bare-hardware support floor for the selected Intel/AMD laptop
# and workstation matrix. Generic VM images remain separately expressible,
# while every Debian x86 desktop/release candidate built by the product path
# composes this profile. Firmware comes only from Debian's signed, timestamped
# non-free-firmware component; package versions remain fixed by the same
# snapshot as the main desktop.

[Distribution]
Repositories=contrib,non-free,non-free-firmware

[Content]
# firmware-linux covers the free base plus the signed snapshot's AMD and
# miscellaneous firmware. Debian deliberately splits Intel graphics/audio,
# common Wi-Fi chipsets, and SOF, so name those contracts explicitly instead
# of assuming one metapackage has Arch's linux-firmware breadth.
Packages=firmware-linux
         firmware-intel-graphics
         firmware-intel-misc
         firmware-intel-sound
         firmware-sof-signed
         firmware-iwlwifi
         firmware-realtek
         firmware-atheros
         firmware-brcm80211
         firmware-mediatek
         firmware-libertas
         intel-microcode
         amd64-microcode
         mesa-vulkan-drivers
         intel-media-va-driver-non-free
