# /run/punar: ready-marker flags + CI artifact staging (milestone-1.md §7).
# Owned by the dev session user so the user session (shell ready flag,
# grim screenshot) can write; the root marker units only read.
d /run/punar 0755 punar punar -

# DNS through systemd-resolved's stub. Without this /etc/resolv.conf is
# whatever the image build left behind — under mkosi that is frequently the
# BUILD HOST's resolver, which is meaningless on the installed machine and
# fails closed as "no DNS" while the interface itself is up and routable.
# L+ replaces whatever is there rather than skipping when a file exists,
# which a plain L would do.
L+ /etc/resolv.conf - - - - /run/systemd/resolve/stub-resolv.conf
