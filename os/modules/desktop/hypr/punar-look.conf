# ────────────────────────────────────────────────────────────────────────────
# PUNAR · HYPRLAND · LOOK — the field-note design language at the
# compositor level. Sourced by hyprland.conf.
#
# Binding references: docs/design/DESIGN_LANGUAGE.md, shell/theme/
# punar-tokens.json. Every literal below is a token value; the token path is
# named next to it (compositor configs can't read JSON — this file is the
# one permitted transcription layer, kept in sync by review).
# Spec §13.4: fluid, not decorative. PERFORMANCE_BUDGETS: idle CPU ~0 and
# software GL in the VM — nothing here may cost per-frame work while idle.
# ────────────────────────────────────────────────────────────────────────────

general {
    # Hairline borders — shape.hairlinePx = 1. Structure is drawn with
    # rules, not chrome.
    border_size = 1

    # Border colors. Windows sit on the paper desktop, but their content is
    # predominantly panel surfaces (terminal, editor). Chosen from
    # punar-tokens.json:
    #   inactive → color.panel.edge #26282E — the same hairline every panel
    #     surface already uses for its edges, so an unfocused window reads
    #     as a quiet instrument edge on paper, not a highlight.
    #   active   → color.paper.ink #000000 — the strongest mark the paper
    #     system has. Focus is stated with maximum contrast, not with hue:
    #     color stays reserved for status (design non-negotiable #2).
    col.active_border = rgb(000000)
    col.inactive_border = rgb(26282E)

    # Gaps: an 8px rhythm everywhere — gaps_in is per-side, so 4+4 between
    # windows equals the 8 at the monitor edge. Small: the desktop is an
    # instrument, not a gallery wall.
    gaps_in = 4
    gaps_out = 8

    layout = dwindle

    # Border dragging is a pointer affordance we don't need; resizing is
    # PUNAR+R (keyboard grammar).
    resize_on_border = false
}

decoration {
    # shape.radiusPx = 10 (matches --radius on every shell surface).
    rounding = 10

    # Fluid, not decorative — and llvmpipe in the VM makes decoration
    # literally expensive. Blur and shadows are ambient ornament: off.
    # (0.56 defaults both ON, so these lines are load-bearing.)
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }

    # No dimming anywhere: focus is already stated by the ink border, and
    # dimming would repaint every window for pure atmosphere.
    dim_inactive = false
    dim_special = 0
}

# ── GROUPS · STACK/TAB GROUPS (spec §13.2 · M2) ─────────────────────────────
# The groupbar is a field-note tab strip: mono labels, hairline geometry,
# paper/ink. No gradients — each tab is its title plus a 2px indicator
# rule, the same selection statement Plate D-007 uses in the overview
# (raised fill + 2px ink rule). Group membership is read from this strip,
# never from a new border hue: color stays reserved for status.

group {
    # Focus on a grouped window is stated exactly like on a solitary one:
    #   active   → color.paper.ink #000000
    #   inactive → color.panel.edge #26282E
    col.border_active = rgb(000000)
    col.border_inactive = rgb(26282E)

    # A locked group stays monochrome — color.paper.ink2 #333333, a quieter
    # ink rather than a status hue. Locking is a command-center verb
    # (milestone-2.md §3); the groupbar indicator repeats the same mark.
    col.border_locked_active = rgb(333333)
    col.border_locked_inactive = rgb(26282E)

    groupbar {
        enabled = true

        # Labels are mono (font.rules.labelsAndData) at font.metaSizePx =
        # 10; the vendored weights are Regular/Medium (fonts module), so
        # active = medium, inactive = normal.
        font_family = Geist Mono
        font_size = 10
        font_weight_active = medium
        font_weight_inactive = normal

        # No tab background washes; flat strip, no rounding. The indicator
        # rule is the 2px ink selection mark.
        gradients = false
        rounding = 0
        height = 18
        indicator_height = 2

        # Text: ink on the paper desktop behind the strip.
        #   active   → color.paper.ink #000000
        #   inactive → color.paper.ink3 #666666
        text_color = rgb(000000)
        text_color_inactive = rgb(666666)

        # Indicator rule: ink for the active tab, paper border #E6E4DE for
        # the rest; locked groups use ink2 (see border rationale above).
        col.active = rgb(000000)
        col.inactive = rgb(E6E4DE)
        col.locked_active = rgb(333333)
        col.locked_inactive = rgb(E6E4DE)
    }
}

# ── MOTION ──────────────────────────────────────────────────────────────────
# tokens motion.ease = cubic-bezier(0.2, 0, 0, 1); motion.durationMs.standard
# = 300 (speed unit here is deciseconds: 3 = 300ms). Motion exists to
# explain a state change — a window re-tiling, a workspace switch, the
# scratchpad arriving — and nothing else. Everything decorative (fades,
# border color animation, layer fades) stays off via the global node.
# The shell animates its own surfaces per tokens; the compositor must not
# double-animate them (layers stay instant).
# tokens motion.durationMs.spatial = 450 is reserved for the M2 overview.

animations {
    enabled = true
}

bezier = punar, 0.2, 0, 0, 1

animation = global, 0
animation = windowsMove, 1, 3, punar
animation = workspaces, 1, 3, punar, slide
animation = specialWorkspace, 1, 3, punar, slidevert

misc {
    # The desktop is flat paper — color.paper.surface #FAF9F6. No wallpaper
    # daemon: hyprpaper would be one more resident process for a solid
    # color the compositor can paint itself (misc:background_color is only
    # shown once the default logo art is disabled).
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(FAF9F6)

    # Compositor-rendered text (ANR dialog, error overlay) uses the design
    # language's sans — font.sans.family, vendored into the image.
    font_family = Instrument Sans
}

dwindle {
    # Keep the split the user made; predictability is part of §13.1.
    preserve_split = true
}
