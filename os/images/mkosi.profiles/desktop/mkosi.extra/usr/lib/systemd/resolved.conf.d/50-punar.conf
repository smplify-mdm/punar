# Punar name resolution: unicast DNS only.
#
# LLMNR and multicast DNS ask and answer for names on whatever link the machine
# is on. On a shared network that announces this machine's hostname to every
# neighbour, and it sends a single-label or mistyped name out for any of them to
# answer, which is how LLMNR poisoning captures credentials. systemd's default
# turns LLMNR on, so both are stated off here.
#
# resolved uses LLMNR or mDNS on a link only when this global setting AND the
# link's own setting allow it, so no .network file can turn either back on.
# This file is in the desktop tree every lane composes (x86_64 Arch, Debian
# amd64 and ARM64). check-release-image.sh A17 refuses a release tree without
# it, or with any resolved configuration that sets either protocol otherwise;
# wifi-check.sh asserts `resolvectl status` reports both off on a running
# machine.
[Resolve]
LLMNR=no
MulticastDNS=no
