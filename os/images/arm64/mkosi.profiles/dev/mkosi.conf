# Native ARM64 development/CI adapter. Product content is supplied by the
# desktop profile; this profile adds only credentials, serial access, mocks
# and the architecture-neutral test harness.

[Output]
ImageId=punar-dev-arm64

[Content]
# The minimal CI image still creates the non-root `punar` account in the
# profile postinstall hook. Debian's explicit base package set does not imply
# either the account-management tools or the user's configured shell.
Packages=passwd
         bash
         # Drives the real sign-in PAM stack (etc/pam.d/greetd) in the desktop
         # gate's keyring check (surfaces-check.sh group 8k), since this image
         # autologins and no password ever goes through PAM otherwise. Dev
         # profile only; Arch does not package it.
         pamtester
KernelCommandLine=
KernelCommandLine=console=tty0 console=ttyAMA0 root=PARTUUID=1beabfe0-9cb8-4b49-91ef-d372b845e7ea rw
Autologin=yes
# Fixed SHA-512 crypt for the documented dev password "punar". A literal
# password would choose a new crypt salt and change the UKI on every build.
RootPassword=hashed:$6$punar-arm64-dev$gWTgk1f0Vl76wHmu/qPIXM89H0xcFqIkBBj9DEPteme3zLnOiSlzdNK/fp4y4jowrT0WWdFFdhUFHC5.Ejxe3/
Hostname=punar-dev-arm64

# Shared dev scripts/units plus native mock binaries staged for desktop CI.
ExtraTrees=../../../mkosi.profiles/dev/mkosi.extra
           mkosi.extra
