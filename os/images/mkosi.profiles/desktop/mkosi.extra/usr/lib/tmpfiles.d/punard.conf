# punard control-plane directories (docs/api/ipc.md section 1.1; M3).
#
# /run/punard is deliberately NOT /run/punar: that M1 dir is 0755 punar:punar
# so the unprivileged session can write CI artifacts — a control socket in a
# peer-writable directory could be unlinked and squatted. The socket itself is
# created 0660 root:punar by punard before listen(); admission = filesystem
# (root or group punar connects, everyone else gets EACCES — spec section 61).
d /run/punard    0750 root punar -
d /var/lib/punar 0700 root root  -
d /var/log/punar 0750 root punar -
