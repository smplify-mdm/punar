# Native ARM64 desktop migration profile.
#
# This is the Debian package-name/PAM/session adapter for the same desktop
# content exercised on x86_64. Native Rust binaries, the per-architecture
# offline OCI fixture and the graphical behavior exercises are proven on
# QEMU's generic ARM `virt` machine; Raspberry Pi and bare metal remain
# separate targets.

[Content]
# Versions are resolved only from snapshot 20260820T000000Z, inherited from
# the primary arm64 config's CLI pin. Names below are Debian's equivalents of
# the shipping x86 profile; no compatibility desktop stack is added. `file`
# is explicit because the shell's cross-architecture wallpaper integrity gate
# verifies both pinned digests and decoded 3840x2400 dimensions; Debian did not
# otherwise pull the utility into the lean ARM closure.
Packages=hyprland
         xdg-desktop-portal-hyprland
         xdg-desktop-portal-gtk
         xdg-desktop-portal
         quickshell
         libqt6svg6
         qt6-wayland
         qml6-module-qt-labs-folderlistmodel
         greetd
         foot
         chromium
         chromium-sandbox
         ca-certificates
         git
         neovim
         geany
         thunar
         thunar-archive-plugin
         tumbler
         gvfs
         gvfs-backends
         ripgrep
         fd-find
         bat
         htop
         lsof
         strace
         podman
         crun
         catatonit
         netavark
         aardvark-dns
         passt
         slirp4netns
         uidmap
         util-linux
         passwd
         sudo
         tzdata
         pipewire
         pipewire-pulse
         wireplumber
         libgl1-mesa-dri
         polkitd
         hyprpolkitagent
         hyprland-qtutils
         fonts-noto-core
         fonts-noto-color-emoji
         grim
         slurp
         wl-clipboard
         xwayland
         systemd-zram-generator
         systemd-resolved
         systemd-userdbd
         systemd-timesyncd
         dbus-broker
         iwd
         wireless-regdb
         xdg-utils
         file
         jq
         nftables
         whois
         bash
         curl
         libarchive-tools
         bubblewrap
         flatpak
         xdg-dbus-proxy

# The shared desktop tree is architecture-neutral. Its generated subtrees are
# staged from os/modules/desktop, shell/, fixtures and compiled binaries before
# a real build; using one tree prevents x86/ARM shell behavior from drifting.
ExtraTrees=../../../mkosi.profiles/desktop/mkosi.extra
           mkosi.extra
