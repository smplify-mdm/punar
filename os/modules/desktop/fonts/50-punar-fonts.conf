<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Punar fontconfig defaults - field note design language.
  Families per shell/theme/punar-tokens.json (font block):
  sans = Instrument Sans, mono = Geist Mono; Noto as fallback
  (noto-fonts / noto-fonts-emoji from the pinned snapshot).
  Intended install path: /etc/fonts/conf.d/50-punar-fonts.conf
  (sorts before 60-latin.conf so these preferences win).
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Instrument Sans</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Geist Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
