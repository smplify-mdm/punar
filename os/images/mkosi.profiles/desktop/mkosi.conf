# punar-desktop: Milestone 1 graphical workstation profile.
#
# mkosi v26 profile (mkosi.profiles/desktop/): layered on top of the base
# os/images/mkosi.conf — the punar-dev minimal image stays untouched, this
# profile only ADDS packages and desktop content (milestone-1.md §3).
# ImageId/Hostname for this profile are passed on the mkosi CLI by
# scripts/container-build.sh (--image-id punar-desktop --hostname
# punar-desktop): CLI scalars override all config files, which sidesteps
# profile scalar-merge ambiguity.
#
# Package set: EXACTLY the verified manifest of milestone-1.md §2.1 (all
# present in ALA snapshot 2026/08/20; versions verified 2026-08-24), plus
# nftables (1:1.1.6-3, verified in the snapshot's extra repo 2026-08-25 and
# absent from base's dependency chain — milestone-3.md §4.1) for punard's
# security.firewall capability. nftables.service is deliberately NOT enabled:
# punard owns the punar-base ruleset and applies it at boot reconcile.
#
# qt6-svg (6.11.2-1, 1056 KiB installed) is named EXPLICITLY as of the
# desktop-surfaces pass even though it adds ZERO bytes to the image: it is
# already a HARD dependency of both `quickshell` and `qt6-wayland`
# (verified against the pinned snapshot — `pacman -Qi qt6-svg` reports
# "Required By: qt6-wayland quickshell"). The wallpaper surface (Plate
# D-015) now loads /usr/lib/qt6/plugins/imageformats/libqsvg.so DIRECTLY,
# so leaving it to another package's dependency list would be an unstated
# assumption an upstream repackaging could silently break. A package we
# depend on by name is a package we notice losing. The package delta for
# the entire desktop-surface pass is this one line and 0 bytes: every other
# surface is QML inside the shell process that already runs, and the
# runtime tools they shell out to (wpctl from wireplumber, hyprctl from
# hyprland, punarctl from the workspace build, grim/slurp/jq) all ship
# already.
# Deliberately NOT shipped (see §2.1 rationale): vulkan-swrast, seatd
# daemon, tuigreet, uwsm, qemu-guest-agent, otf-geist-mono-nerd,
# linux-firmware. Budget discipline per PERFORMANCE_BUDGETS.md: no GNOME/KDE
# stacks, no pulseaudio (pipewire-pulse shim only), nothing decorative.
#
# Desktop config/assets land via two extra-tree layers:
#   - mkosi.extra/ (versioned): greetd session chain, /usr/lib/punar
#     scripts, marker/RAM units, tmpfiles.
#   - mkosi.extra/ (staged, gitignored): Hyprland/foot/fontconfig configs
#     from os/modules/desktop, vendored fonts, punar-shell QML + tokens —
#     copied in by scripts/container-build.sh so the module trees stay the
#     single source of truth (os/images/.gitignore lists the staged paths).
# mkosi.postinst.chroot (this directory) creates the dev user and enables
# greetd + graphical.target.

[Content]
Packages=hyprland
         xdg-desktop-portal-hyprland
         xdg-desktop-portal
         quickshell
         qt6-svg
         greetd
         foot
         chromium
         git
         neovim
         podman
         crun
         netavark
         aardvark-dns
         pipewire
         pipewire-pulse
         wireplumber
         mesa
         polkit
         hyprpolkitagent
         noto-fonts
         noto-fonts-emoji
         grim
         slurp
         wl-clipboard
         jq
         nftables
