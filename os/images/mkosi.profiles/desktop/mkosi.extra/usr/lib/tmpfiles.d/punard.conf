# punard control-plane directories (docs/api/ipc.md section 1.1; M3).
#
# /run/punard is deliberately NOT /run/punar: that M1 dir is 0755 punar:punar
# so the unprivileged session can write CI artifacts — a control socket in a
# peer-writable directory could be unlinked and squatted. The socket itself is
# created 0660 root:punar by punard before listen(); admission = filesystem
# (root or group punar connects, everyone else gets EACCES — spec section 61).
d /run/punard    0750 root punar -
d /var/lib/punar 0700 root root  -
d /var/log/punar 0750 root punar -
# Org policy drop directory (milestone-4.md §3.1): RESERVED in M4 — punard
# loads policy-source envelopes from here at startup, but nothing ships any
# (unmanaged-first, design section 8; files arrive with M5 enrollment).
# Root-only: a writable drop dir IS policy authority.
d /var/lib/punar/policy.d 0700 root root -
# M9 approval + grant stores (docs/api/ipc.md section 14.3;
# docs/development/milestone-9.md §4.1). 0700 root:root, records 0600 —
# stricter than the ledger, for a stronger reason: these files ARE the
# authority record of what a human agreed to and what privilege is live
# right now. A peer who could rewrite them could grant themselves fifteen
# minutes of root by editing a JSON file.
#
# punard creates both directories itself at startup, so a missing line here
# degrades nothing — the lines exist so the modes are declared in the image,
# where an auditor can read them, rather than only in a Rust constant (the
# M8 ledger-directory pattern).
d /var/lib/punar/approvals 0700 root root -
d /var/lib/punar/grants    0700 root root -
# M9 organization AI-authority layers (SPEC section 20, section 39 rank 2).
# RESERVED: punard and punar-secrets both read <policy_id>.yaml +
# <policy_id>.json provenance pairs from here, and M9 ships NO producer for
# the directory — the mock control plane still serves the M5 baseline only
# (milestone-9.md §5.2). It exists so an enrolled device is never silently
# answered from the personal defaults, and it is root-only for the same
# reason policy.d is: a writable drop dir IS policy authority.
d /var/lib/punar/policy.d/ai 0700 root root -
