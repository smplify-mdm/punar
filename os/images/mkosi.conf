# Punar x86_64 image base. Development-only access lives in the dev profile;
# this file is safe to compose into a release image.
#
# Substrate per ADR-001: minimal Arch package payload, mkosi-built.
# This is the smallest thing that satisfies spec 66 MVP ("VM image;
# repeatable build; development VM") and spec 76 Milestone 0 acceptance
# ("reproducible build and VM boot"). Hardware enablement belongs in a
# separate physical-machine profile: linux-firmware is deliberately excluded
# from this generic UEFI/QEMU base because virtio needs none.
#
# The package mirror is NOT set here: tools/build-image.sh /
# scripts/container-build.sh pass --mirror from os/images/snapshot.env so
# the snapshot pin has a single source of truth.
#
# Not yet done (tracked in docs/development/image-pipeline.md): signed
# UKIs/Secure Boot, btrfs+snapper rollback layout, ISO output, vendor
# mirror. Milestone 0 output is unsigned.

[Distribution]
Distribution=arch
Architecture=x86-64

[Output]
Format=disk
OutputDirectory=out
# Fixed seed -> stable partition UUIDs across builds (input-determinism;
# see vdwaa.nl/mkosi-reproducible-arch-images.html).
Seed=7ad2f9bf-3e52-4c05-8f2c-2b8a44f0a1c5

[Build]
CacheDirectory=cache

[Content]
# 'base' pulls systemd, pacman, coreutils, util-linux, dbus.
Packages=base
         linux
Bootable=yes
Bootloader=systemd-boot
# The UKI is the slot selector: root A's literal PARTUUID is embedded in the
# signed boot artifact. Future slot-B UKIs carry slot B's UUID instead.
KernelCommandLine=console=tty0 systemd.getty_auto=no root=PARTUUID=1beabfe0-9cb8-4b49-91ef-d372b845e7ea rw
Locale=C.UTF-8
Timezone=UTC
# Clamp timestamps to the snapshot date (2026-08-20T00:00:00Z) for
# input-deterministic output.
SourceDateEpoch=1787184000
