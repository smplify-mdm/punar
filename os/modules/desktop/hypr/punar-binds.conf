# ────────────────────────────────────────────────────────────────────────────
# PUNAR · HYPRLAND · BINDS — the §13.3 window grammar. Sourced by
# hyprland.conf; variables ($mod, $commandCenter, …) are defined there.
#
# Human-readable reference table: docs/development/keyboard-grammar.md.
# Every bind uses `bindd` (description flag) so `hyprctl binds -j` is
# self-describing — that feed powers the §12.3 discoverability surfaces
# (SUPER-hold overlay, `?` help) in M2 without a second source of truth.
# Descriptions must not contain commas (hyprlang field separator).
# ────────────────────────────────────────────────────────────────────────────


# ── FOCUS · SUPER + H/J/K/L ────────────────────────────────────────────────

bindd = $mod, H, Focus left, movefocus, l
bindd = $mod, J, Focus down, movefocus, d
bindd = $mod, K, Focus up, movefocus, u
bindd = $mod, L, Focus right, movefocus, r
# Note: spec §13.3 also sketches SUPER+L as "layout chooser"; HJKL focus
# wins (same table, and §13.3 allows bindings to evolve). The M2 layout
# chooser will live in the command center and/or another chord.

# ── MOVE WINDOW · SUPER + SHIFT + H/J/K/L ──────────────────────────────────

bindd = $mod SHIFT, H, Move window left, movewindow, l
bindd = $mod SHIFT, J, Move window down, movewindow, d
bindd = $mod SHIFT, K, Move window up, movewindow, u
bindd = $mod SHIFT, L, Move window right, movewindow, r

# ── RESIZE MODE · SUPER + R ────────────────────────────────────────────────
# A submap: enter, resize with the same HJKL grammar (hold-repeat enabled),
# Escape or Return exits. 40px steps — decisive, keyboard-sized increments.

bindd = $mod, R, Enter resize mode, submap, resize

submap = resize
bindde = , H, Resize narrower, resizeactive, -40 0
bindde = , J, Resize taller, resizeactive, 0 40
bindde = , K, Resize shorter, resizeactive, 0 -40
bindde = , L, Resize wider, resizeactive, 40 0
bindd = , escape, Exit resize mode, submap, reset
bindd = , Return, Exit resize mode, submap, reset
submap = reset

# ── MODES ──────────────────────────────────────────────────────────────────

bindd = $mod, F, Toggle fullscreen, fullscreen, 0
bindd = $mod, V, Toggle floating, togglefloating

# ── WORKSPACES · SUPER + 1..9 ──────────────────────────────────────────────

bindd = $mod, 1, Workspace 1, workspace, 1
bindd = $mod, 2, Workspace 2, workspace, 2
bindd = $mod, 3, Workspace 3, workspace, 3
bindd = $mod, 4, Workspace 4, workspace, 4
bindd = $mod, 5, Workspace 5, workspace, 5
bindd = $mod, 6, Workspace 6, workspace, 6
bindd = $mod, 7, Workspace 7, workspace, 7
bindd = $mod, 8, Workspace 8, workspace, 8
bindd = $mod, 9, Workspace 9, workspace, 9

bindd = $mod SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = $mod SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = $mod SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = $mod SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = $mod SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = $mod SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = $mod SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = $mod SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = $mod SHIFT, 9, Move window to workspace 9, movetoworkspace, 9

# ── OVERVIEW PLACEHOLDER · SUPER + TAB ─────────────────────────────────────
# M1: cycle through open workspaces (e±1 = existing only, all monitors).
# M2 replaces this with the graphical project overview (spec §14.2) —
# planned as a shell IPC call like $commandCenter, e.g.
#   bindd = $mod, Tab, Project overview, exec, quickshell ipc call overview toggle

bindd = $mod, Tab, Next workspace, workspace, e+1
bindd = $mod SHIFT, Tab, Previous workspace, workspace, e-1

# ── COMMAND CENTER · SUPER + SPACE ─────────────────────────────────────────
# The universal command center (spec §12.2), served by punar-shell.
# The IPC contract lives in the single $commandCenter variable.

bindd = $mod, Space, Open command center, exec, $commandCenter

# ── WINDOWS AND APPS ───────────────────────────────────────────────────────

bindd = $mod, Q, Close window, killactive
bindd = $mod, Return, Open terminal, exec, $terminal || $terminalFallback
bindd = $mod, B, Open browser, exec, $browser

# ── SCRATCHPAD TERMINAL · SUPER + T (spec §13.6) ───────────────────────────
# Toggles the special workspace holding the pre-spawned $scratchClass foot
# (exec-once in hyprland.conf). M2 adds the assistant and notes scratchpads
# on their own special workspaces. If the scratch terminal is closed, the
# special workspace closes with it (misc:close_special_on_empty default);
# relaunch via SUPER+Space or `foot --app-id=punar-scratch`.

bindd = $mod, T, Toggle scratchpad terminal, togglespecialworkspace, term

# The scratchpad presents as a centered card: 62% × 58% of the monitor,
# floating, parked silently on special:term at spawn so session start never
# raises it. (0.56 windowrule field grammar; size takes expressions —
# percent units don't exist there.)
windowrule = match:class ^($scratchClass)$, workspace special:term silent, float on, size monitor_w*0.62 monitor_h*0.58, center on

# ── MULTI-MONITOR · SUPER + SHIFT + ARROWS (spec §15) ──────────────────────
# Explicit cross-display moves; HJKL focus/move also spill over edges via
# binds:window_direction_monitor_fallback (hyprland.conf).

bindd = $mod SHIFT, left, Move window to left monitor, movewindow, mon:l
bindd = $mod SHIFT, right, Move window to right monitor, movewindow, mon:r
bindd = $mod SHIFT, up, Move window to upper monitor, movewindow, mon:u
bindd = $mod SHIFT, down, Move window to lower monitor, movewindow, mon:d

# ── SCREENSHOTS (spec §12.1) ───────────────────────────────────────────────
# Keyboard path: Print copies the full output to the clipboard. The region
# variant needs the pointer for slurp — documented as pointer-assisted.

bindd = , Print, Screenshot output to clipboard, exec, grim - | wl-copy --type image/png
bindd = $mod SHIFT, S, Screenshot region to clipboard, exec, grim -g "$(slurp)" - | wl-copy --type image/png

# ── SESSION ────────────────────────────────────────────────────────────────
# Ends the Hyprland session; greetd falls back to its default_session
# (agreety) per milestone-1.md §4.

bindd = $mod SHIFT, E, End session, exit
