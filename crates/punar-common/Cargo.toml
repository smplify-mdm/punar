[package]
name = "punar-common"
description = "Core Punar domain types, typed IPC contract, and audit plumbing shared by all services (SPEC sections 18, 20, 41, 53, 60, 61)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
# serde_json graduated from dev-dependency in M3: the IPC envelope carries
# params/results/state values as structured JSON and the audit writer emits
# JSONL. Already in the workspace dependency set — no new supply chain.
serde_json = { workspace = true }
thiserror = { workspace = true }
# M7 (docs/api/ipc.md section 10.4): flock behind AuditWriter's rotation
# lock — punard and punar-agentd now append to the same trail, and the
# size-check + rename must be serialized between processes. Already in the
# workspace tree for punard's SO_PEERCRED; the `fs` feature adds no new
# crate. `flock` is not reachable from safe std, and workspace crates are
# #![forbid(unsafe_code)].
rustix = { workspace = true }
# M13-U release verification. These are already workspace dependencies used
# by recovery-key escrow; adding them here creates no second cryptographic
# implementation or unpinned supply-chain edge. Release signatures are raw
# Ed25519 over the exact manifest bytes, and payload/cohort hashing is SHA-256.
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
