# The lock authentication socket's directory. 0750 root:punar: only root and a
# member of the admission group can traverse it, and every onboarding-created
# account is a mandatory member of punar. Mode and ownership are set here rather
# than by the daemon, so there is never a window in which the socket exists with
# wider access than intended.
d /run/punar-authd 0750 root punar -
